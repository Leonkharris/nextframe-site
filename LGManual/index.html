<script>window.MANUAL={"meta":{"version":"2026-10-16","source":"Condensed from the back-office training deck (後台教育訓練_en.pptx, 93 slides, three scenarios). Screens are the test back office as of September 2026; staff names, usernames, keys, passwords and server addresses are covered with solid blocks. Labels in 「brackets」 are what the screen says in Chinese.","glossaryLead":"The back office speaks Chinese, the training speaks English, and both use jargon. Left: the word the training uses. Middle: what you will see on screen. Right: what it actually means."},"sections":[{"id":"basics","title":"Start here","short":"Basics","kicker":"Part 0 · Basics","blurb":"How the back office is laid out, how to tell test from production, the three levels of on/off switch, and the rules that prevent the expensive mistakes."},{"id":"games","title":"Game management","short":"Games","kicker":"Scenario 1","blurb":"Switching games and providers on and off, maintenance windows, adding games by hand, and syncing them from a provider’s API."},{"id":"reverse","title":"Reverse provider onboarding","short":"Reverse providers","kicker":"Scenario 2","blurb":"A game studio connects its games to our platform: we create it, hand over the connection info, let it test in Playground, then switch it to production and sync its games.","flow":"Create provider → Hand over connection info → Enable Playground → Watch progress → All green, leave Sandbox → Sync games → Import test"},{"id":"clients","title":"Client onboarding","short":"Clients","kicker":"Scenario 3 · Aggregation","blurb":"A client (tenant) connects to our games: we create the tenant and its credential, the client tests itself in Playground until all green, and only then do we issue the production credential.","flow":"Create tenant → Create credential → Enable Playground → Client tests to all green → We QA → Production credential, in production"}],"home":{"title":"Every back-office task, one search away","lead":"The back-office training, condensed for the CS team: every task, every warning, every screen, with the Chinese labels you will actually see. Search for a task, type what the client just told you, or copy a label off the screen.","chips":["client can't see a game","turn off a game for one client","provider is down","studio lost their key","client says testing is done","安全閥","time zone","production credential"],"before":"Six rules from the training. Each one prevents a mistake that reaches every client or real money. Click one for the full page.","rules":[{"ic":"🌐","title":"Check the address bar first","text":"Test and production look identical. The URL is the only way to tell them apart.","topic":"environments"},{"ic":"🎯","title":"One client? Use the client’s page","text":"Switching a game off on the provider’s game page takes it away from every client.","topic":"game-off-one-client"},{"ic":"🟢","title":"Nothing goes to production before all green","text":"Not a studio leaving Sandbox, not a client’s production credential.","topic":"production-credential"},{"ic":"🧯","title":"Never release the safety valve out of habit","text":"Ticking it really disables those games, for everyone.","topic":"safety-valve"},{"ic":"🔐","title":"Keys and passwords never go in group chats","text":"Encrypted email or a password manager, every time.","topic":"secret-key"},{"ic":"🧪","title":"Never test in production","text":"All onboarding and testing happens in the test back office.","topic":"environments"}],"coloursLead":"Every onboarding hint in the back office is colour-coded. The colour tells you whose turn it is before you read a word.","colours":[{"k":"y","name":"Yellow · our move","text":"Do what the box says."},{"k":"r","name":"Red · their move","text":"The other side has something to fix. Send them the card or the report."},{"k":"g","name":"Green · next step","text":"This stage is done. Move on to the next one."}]},"glossary":[{"term":"Tenant","zh":"租戶 (some pages: 營運商 Operator)","plain":"**Our client**: an operator that offers our games to its players."},{"term":"Agent","zh":"代理商","plain":"**One of the client’s sites or brands.** A tenant can have several; each agent gets its own credential."},{"term":"Provider","zh":"遊戲供應商","plain":"**A company that makes games** (a game studio)."},{"term":"Reverse provider","zh":"Reverse 供應商 · 反串接","plain":"**A game studio that connects to our platform itself**, instead of us connecting to its API."},{"term":"Credential","zh":"憑證 · API憑證","plain":"**The access badge a client uses to connect to our system.** One per agent; a separate one is issued in production."},{"term":"Secret Key","zh":"密鑰 · Secret Key","plain":"A reverse provider’s **signing key**. As sensitive as a password.","note":"See [[secret-key]]."},{"term":"Access Key","zh":"Access Key","plain":"A reverse provider’s **Playground login key**.","note":"See [[rp-reissue-key]]."},{"term":"Playground","zh":"Playground","plain":"**A practice room** where the other side tests its integration on its own. Exists only in the test environment."},{"term":"Sandbox","zh":"Sandbox 模式","plain":"**Test mode, no real money.** The opposite is Production (正式)."},{"term":"Production","zh":"正式 · 正式環境","plain":"**The real thing**: real players, real money. Also the name of the second back office."},{"term":"All green","zh":"全綠通過 · 驗收全綠","plain":"**All tests passed.** The only basis for going to production."},{"term":"Acceptance","zh":"驗收","plain":"The automated test run the studio or client completes in Playground."},{"term":"Blocking level","zh":"阻塞層","plain":"The level of an acceptance report where the first failure stopped the run. Everything after it is skipped, not failed.","note":"See [[read-report]]."},{"term":"Provider cost GGR%","zh":"供應商成本 GGR%","plain":"**What we pay the studio**: its commission as a percentage of the game’s GGR. Type 5 for 5%."},{"term":"Our markup GGR%","zh":"我方加成 GGR%（毛利）","plain":"**What we add on top for the client** (our gross margin), set per client."},{"term":"GGR","zh":"GGR · 毛收入","plain":"Gross gaming revenue: what players bet minus what they win back. Both rates above are percentages of it."},{"term":"Maintenance window","zh":"維護視窗","plain":"A planned period when a game or provider is down. The system starts and ends it automatically.","note":"See [[maintenance-scheduled]]."},{"term":"Safety valve","zh":"安全閥","plain":"A sync guard that blocks a sync from disabling too many games at once.","note":"See [[safety-valve]]."},{"term":"Last sync","zh":"上次同步","plain":"Provider-list column that tells you how a provider’s games arrive: 手動維護 Manual (added by hand), an API sync result, or 反串接 Reverse."},{"term":"Wallet mode","zh":"錢包模式","plain":"How the client’s player wallet works with ours, set on the credential (e.g. 現金錢包 Cash wallet)."},{"term":"Webhook URL","zh":"Webhook 網址","plain":"The client’s address that our platform calls, set on the credential."},{"term":"Health dashboard","zh":"健康度儀表板","plain":"The card on a tenant’s Overview that lists what is still missing."},{"term":"Disabled by platform","zh":"平台已停用","plain":"Badge on a client’s game list: the game is off platform-wide, so the client’s own switch is locked."}],"topics":[{"section":"basics","id":"back-office-map","title":"Finding your way around","summary":"Five menus on the left. Three of them hold almost everything in this manual: Games, Manage and Tenants.","where":"Left menu: {Dashboard|儀表板} · {Reports|報表} · {Tenants|租戶} · {Games|遊戲} · {Manage|管理}","asks":["I’m new and don’t know where anything is","Where is the provider list, maintenance, or Playground acceptance?"],"aka":["menu","navigation","where is","sidebar","layout"],"table":{"head":["Menu","What’s in it","Used for"],"rows":[["{Games|遊戲}","{Game list|遊戲列表}, {Provider list|遊戲供應商列表}, {Reverse provider list|Reverse 供應商列表}, plus provider social coins and free-spin management","[[enable-game|Scenario 1]] and [[rp-overview|Scenario 2]]"],["{Manage|管理}","{Maintenance|維護管理}, {Playground acceptance|Playground 驗收管理}, plus admin lists, permissions and the {Operation log|操作紀錄}","[[maintenance-scheduled|Maintenance]] and [[all-clients-status|every client’s test status]]"],["{Tenants|租戶}","{Create new tenant|建立新租戶}, {Tenant list|租戶列表}","[[client-overview|Scenario 3]] and per-client switches"]]},"steps":[{"t":"Most actions start from the **⋮ menu at the end of a row**. On the provider list it holds {Update provider info|更新供應商資訊} and {View games|查看遊戲}.","shot":{"img":"s04","lb":["Row-end menu → View games"],"cap":"Provider list with a row’s ⋮ menu open","hl":[[80.3,30.2,11.5,6.4]],"w":1440,"h":1000}}],"tips":["The top bar shows the clock in **UTC+8** and the language switch ({Traditional Chinese|繁體中文}). Screens in this manual are in Chinese; the English names are the ones the training uses."],"related":["environments","switch-levels","colours"],"source":"deck slide 4"},{"section":"basics","id":"environments","title":"Test or production? Check the address bar","summary":"There are two back offices and they look identical. All onboarding and testing happens in test. Production is only for the last step: issuing production credentials.","asks":["Which back office should I be in?","Am I in production right now?","Where do I issue a production credential?"],"aka":["test environment","production environment","url","address bar","staging","live","two back offices"],"watch":["!The two back offices look the same: same menus, same layout, either theme. **Check the URL before you click anything.**"],"steps":[{"t":"**Test environment:** everything. Creating providers and tenants, Playground, acceptance, switching games during onboarding."},{"t":"**Production environment:** only the final step, [[production-credential|issuing the production credential]] once a client is all green. Production has no Playground."},{"t":"Tell them apart by the **address bar** and nothing else. The production address differs from the test one; get both from your lead and bookmark them rather than typing them from memory.","shot":{"img":"s05","lb":["Production address bar"],"cap":"Production back office. The host name is covered in this manual.","hl":[[6.1,-0.7,28.5,6]],"w":1504,"h":884}}],"related":["production-credential","never-do","back-office-map"],"source":"deck slides 5 and 86"},{"section":"basics","id":"switch-levels","title":"Three levels of on/off switch","summary":"A game can be switched off at three levels. Pick the level that matches who should lose it. The wrong level is the most common expensive mistake.","asks":["Should I switch off the provider, the game, or the client?","A client says a game disappeared"],"aka":["switch","toggle","level","on off","who is affected"],"table":{"head":["Level","Where","Who loses the game","Guide"],"rows":[["Provider","{Provider list|遊戲供應商列表} → ⋮ → {Update provider info|更新供應商資訊} → status","Every game of that studio, for every client","[[provider-off]]"],["Game","Provider’s game page → {Status|狀態} switch","That one game, for every client","[[game-off]]"],["Client","Tenant → {Game providers|遊戲供應商} tab → {View games|檢視遊戲}","Only that client","[[game-off-one-client]]"]]},"watch":["!Switching a game off on the **provider’s game page** when you meant **one client** turns it off for every client."],"related":["game-off-one-client","game-off","provider-off"],"source":"deck slide 7"},{"section":"basics","id":"colours","title":"Yellow, red, green: whose move is it","summary":"Every onboarding hint in the back office is colour-coded. Read the colour before you read the words.","aka":["colour","color","yellow","red","green","grey","status colours","whose turn"],"table":{"head":["Colour","Means","Examples"],"rows":[["Yellow","**Our move.** Do what the box says.","{Enable Playground|開通 Playground} inside a yellow hint · the yellow “not all green” warning before leaving Sandbox"],["Red","**Their move.** The other side has something to fix; send them the report.","{Failed|未通過} on a client’s credential · red phases on a studio’s acceptance card"],["Green","**Next step.** This stage is done.","{All green passed|全綠通過} · {Onboarding complete|對接完成}"]]},"tips":["Grey usually means **nothing has happened yet**: {Never run|從未執行}, {Not enabled|未開通}, or {Skipped|跳過} in a report, which is not a failure."],"related":["all-clients-status","check-result","rp-progress"],"source":"deck slide 90"},{"section":"basics","id":"never-do","title":"Five things never to do","summary":"The training’s closing list. Each one reaches every client, real money, or a credential.","aka":["rules","mistakes","don't","never","forbidden"],"steps":[{"t":"Switch a game off on the **provider game page** when you meant **one client**. → [[game-off-one-client]]"},{"t":"Leave Sandbox, or issue a production credential, **before all green**. → [[rp-leave-sandbox]] · [[production-credential]]"},{"t":"Tick {Release safety valve|放行安全閥} **out of habit**. → [[safety-valve]]"},{"t":"Paste credentials or Secret Keys into **group chats**. → [[secret-key]]"},{"t":"**Test in the production environment.** → [[environments]]"}],"related":["colours","environments","safety-valve"],"source":"deck slide 91"},{"section":"basics","id":"practice","title":"Practice exercises","summary":"The training’s hands-on round. Do these in groups, in the test environment, before touching a real onboarding.","aka":["exercise","hands-on","training","practice","new staff"],"watch":["!**Test environment only.** Check the address bar before you start."],"steps":[{"t":"Add one game and enable it. → [[add-game]], then [[enable-game]]"},{"t":"Create a reverse provider and enable its Playground. → [[rp-create]], then [[rp-playground]]"},{"t":"Create a tenant, all the way to seeing the Playground section on its credential page. → [[create-tenant]], [[tenant-prerequisites]], [[create-credential]]"}],"related":["environments","add-game","create-tenant"],"source":"deck slide 92"},{"section":"basics","id":"who-to-ask","title":"Who to ask when stuck","summary":"Escalation contacts for back-office questions and emergencies.","aka":["contact","escalate","emergency","manager","help","stuck"],"todo":"The training closes on a contacts slide (who to ask when stuck, who to call in an emergency), but the names were given in the room, not written on the slide. Add them here.","tips":["Until this is filled in: anything that touches production, releasing the safety valve, or forcing a studio out of Sandbox goes to your manager first. The training says so on each of those pages."],"related":["safety-valve","rp-leave-sandbox","never-do"],"source":"deck slide 93"},{"section":"games","id":"enable-game","title":"Enable a game (rate first)","summary":"New games start switched off. Enter the provider cost rate first, then flip the status switch on, then check the client’s side is on too.","where":"{Games|遊戲} → {Provider list|遊戲供應商列表} → row ⋮ → {View games|查看遊戲}","asks":["A new game needs to go live","The game page says games have no cost rate","What does the red “Unset” badge mean?"],"aka":["turn on game","activate game","go live","set rate","cost rate","commission","unset","new game live"],"watch":["!**Rate first, switch second.** Enabling a game before entering its rate makes the reports calculate the wrong money."],"steps":[{"t":"Open the provider list, then the row’s ⋮ menu → {View games|查看遊戲}. This is the provider’s game page.","shot":{"img":"s04","lb":["View games"],"cap":"Provider list → row ⋮ → View games","hl":[[80.3,30.2,11.5,6.4]],"w":1440,"h":1000}},{"t":"Turn on {Show unset only|僅顯示未設定} to list only the games with no rate. They carry a red {Unset|未設定} badge in the {Provider cost GGR%|供應商成本 GGR%} column, and a yellow banner counts them: “This provider still has 18 games with no cost rate set”.","shot":{"img":"s09","lb":["Show unset only","Unset rate"],"cap":"Provider game page (ATG), filtered to games without a rate","hl":[[20.1,33,4.4,5],[63.7,43.8,5.2,4.8]],"w":1440,"h":1000}},{"t":"Open the game’s {Update game info|更新遊戲資訊} dialog, enter {Provider cost GGR%|供應商成本 GGR%} and press {Save|儲存}. The rate is the studio’s commission as a percentage of the game’s GGR: **type 5 for 5%**.","shot":{"img":"s10","lb":["Provider cost GGR%","Save"],"cap":"Update game info dialog","hl":[[24.9,45.2,50.3,5.3],[49.9,73.6,17.2,6.3]],"w":1440,"h":1000}},{"t":"Flip the game’s {Status|狀態} switch on. Grey {Disabled|停用} becomes orange {Enabled|啟用}, effective immediately.","pair":[{"img":"s11","lb":["Status switch: off"],"cap":"Chicken Tour, rate 3.00% already set, still off","hl":[[46.5,44.1,4,4]],"w":1440,"h":1000},{"img":"s12","lb":["Status switch: on"],"cap":"The same row, switched on","hl":[[46.5,44.1,4,4]],"w":1440,"h":1000}]},{"t":"Then [[check-client-side|check the client’s side is on too]]. Every client has its own switch for each game."}],"tips":["In the same dialog, a yellow note under the free-spin switches says the provider API’s value is authoritative there and the next GameArt free-spin sync may overwrite a manual setting. The rate is what you came for; leave the free-spin switches alone unless told otherwise."],"labels":[["Show unset only","僅顯示未設定"],["Unset","未設定"],["Provider cost GGR%","供應商成本 GGR%"],["Update game info","更新遊戲資訊"],["Save · Cancel","儲存 · 取消"],["Enabled · Disabled","啟用 · 停用"],["Add game","新增遊戲"],["Export","匯出"],["Back to list","回到列表"],["Built-in free spins","內建免旋玩法"],["Free spins grantable by API","可 API 發放免旋"]],"related":["check-client-side","add-game","sync-update-games","switch-levels"],"source":"deck slides 8–12"},{"section":"games","id":"check-client-side","title":"Check the client’s side is on","summary":"Every client has its own switch for each game. If a game is on at platform level but a client still can’t see it, look here.","where":"{Tenants|租戶} → {Tenant list|租戶列表} → tenant → {Game providers|遊戲供應商} tab → {View games|檢視遊戲}","asks":["The client says they can’t see a game we enabled","A game is on but missing for one client"],"aka":["client can't see game","game missing","not showing","not visible","client side","operator side","markup"],"steps":[{"t":"Open the client’s {Tenant details|租戶詳情} and go to the {Game providers|遊戲供應商} tab."},{"t":"On the provider’s row, click {View games|檢視遊戲}."},{"t":"Find the game and check its {Status|狀態} switch. Green {Enabled|啟用} means this client can offer it.","shot":{"img":"s13","lb":["Client-side switch"],"cap":"Tenant detail → one provider’s games","hl":[[48.1,43.6,4.5,4.9]],"w":1440,"h":1000}}],"tips":["If the switch is locked and shows a red {Disabled by platform|平台已停用} badge, the game is off for everyone. That is fixed on the provider’s game page, not here: see [[game-off]].","This page shows a different rate column, {Our markup GGR%|我方加成 GGR%（毛利）}: what we add on top for this client. Its yellow banner counts games with no **markup** rate ({markup rate|加成率}), where the provider page counts the **cost** rate ({cost rate|成本率})."],"labels":[["Back to provider list","返回供應商列表"],["Tenant ID","租戶ID"],["Our markup GGR% (gross margin)","我方加成 GGR%（毛利）"],["Provider name","供應商名稱"],["Disabled by platform","平台已停用"]],"related":["enable-game","game-off-one-client","game-off"],"source":"deck slide 13"},{"section":"games","id":"game-off","title":"Disable a game for everyone","summary":"Switching a game off on the provider’s game page takes it away from every client, immediately.","where":"Provider’s game page: {Provider list|遊戲供應商列表} → ⋮ → {View games|查看遊戲}","asks":["A game is broken and must come off everywhere","The provider retired a game","Why is a client’s switch locked?"],"aka":["turn off game","remove game","hide game","deactivate","disabled by platform","locked switch","all clients"],"watch":["!This is platform-wide. If only one client should lose the game, use [[game-off-one-client]] instead."],"steps":[{"t":"On the provider’s game page, flip the game’s {Status|狀態} switch off. Orange {Enabled|啟用} becomes grey {Disabled|停用}.","pair":[{"img":"s12","lb":["Status switch: on"],"cap":"Before","hl":[[46.5,44.1,4,4]],"w":1440,"h":1000},{"img":"s15","lb":["Status switch: off"],"cap":"After","hl":[[46.5,44.1,4,4]],"w":1440,"h":1000}]},{"t":"It takes effect **immediately, for every client**."},{"t":"On every client’s game list the game now shows a red {Disabled by platform|平台已停用} badge and the client’s switch is **locked**: they cannot turn it back on.","shot":{"img":"s16","lb":["Locked switch: Disabled by platform"],"cap":"A client’s game list after the platform-wide disable","hl":[[48,43.6,12.6,4.9]],"w":1440,"h":1000}}],"tips":["If the game is only down for a while, use [[maintenance-unplanned|maintenance]] instead of switching it off. Maintenance can end on its own; a switch stays off until someone remembers it."],"related":["game-off-one-client","maintenance-unplanned","provider-off","switch-levels"],"source":"deck slides 14–16"},{"section":"games","id":"game-off-one-client","title":"Turn a game off for one client only","summary":"Use the client’s own detail page, not the provider’s game page.","where":"{Tenants|租戶} → tenant → {Game providers|遊戲供應商} → {View games|檢視遊戲}","asks":["One client wants a game removed","Turn off a game for this operator only"],"aka":["one client","single operator","specific client","per client","only this client","remove for client"],"watch":["!Using the provider game page instead switches the game off for **every** client."],"steps":[{"t":"Open the client’s {Tenant details|租戶詳情} → {Game providers|遊戲供應商} tab → {View games|檢視遊戲} on the provider’s row."},{"t":"Flip **this client’s** {Status|狀態} switch off. Only this client loses the game.","shot":{"img":"s17","lb":["This client’s switch"],"cap":"Tenant’s game list: a switch here affects this client only","hl":[[48.1,50.1,4.5,4.9]],"w":1440,"h":1000}}],"tips":["To take a whole provider away from one client, use the {Enabled?|是否開啟} switch on the {Game providers|遊戲供應商} tab itself. See [[provider-off]]."],"related":["check-client-side","game-off","provider-off"],"source":"deck slide 17"},{"section":"games","id":"maintenance-scheduled","title":"Schedule a maintenance window","summary":"When a provider announces downtime, create a window. The system starts and ends it automatically.","where":"{Manage|管理} → {Maintenance|維護管理} → {Create maintenance window|建立維護視窗}","asks":["A provider sent a maintenance notice","A game will be down from 10:00 to 12:30","Planned downtime"],"aka":["downtime","provider down","outage","planned maintenance","maintenance notice","schedule"],"steps":[{"t":"Go to {Manage|管理} → {Maintenance|維護管理} and press {Create maintenance window|建立維護視窗}.","shot":{"img":"s18","lb":["Create maintenance window"],"cap":"Maintenance list: one provider in progress, one ended","hl":[[20.4,30.2,10.4,5.2]],"w":1440,"h":1000}},{"t":"Set the scope, {Maintenance level|維護層級}: {Game|遊戲} or {Provider|供應商}. Pick the targets; for games, one or more in {Target games|目標遊戲}.","shot":{"img":"s19","lb":["Scope: Game or Provider","Target games","Start time","End time (optional)"],"cap":"Create maintenance window dialog","hl":[[24.3,33,51.4,5.2],[24.3,40.2,51.4,5.2],[24.3,47.4,25.8,5.2],[49.9,47.4,25.8,5.2]],"w":1440,"h":1000}},{"t":"Enter {Start time|開始時間} and {End time|結束時間}. Choose the {Source|來源}, {Provider notice|供應商通知} (the default) or {Self-detected|自行偵測}, and add a {Reason|原因}, such as the provider’s notice text."},{"t":"Press {Confirm|確認}. The system **starts and ends** the window automatically."}],"tips":["End time is optional. Leave it empty and the list shows {No scheduled end time|無預定結束時間}; then someone has to [[maintenance-unplanned|end it by hand]].","The back-office clock runs on UTC+8, and a provider notice quotes its own time zone (the training example says GMT+8). Convert before you type the times."],"labels":[["Maintenance level","維護層級"],["Maintenance target","維護對象"],["Operator","營運商"],["In progress · Ended","進行中 · 已結束"],["Start time · End time","開始時間 · 結束時間"],["Reason","原因"],["Source","來源"],["Provider notice · Self-detected","供應商通知 · 自行偵測"],["No scheduled end time","無預定結束時間"]],"related":["maintenance-unplanned","maintenance-notice","game-off"],"source":"deck slides 18–19"},{"section":"games","id":"maintenance-unplanned","title":"Start or end maintenance now","summary":"For unplanned downtime: start maintenance on the spot from the game or provider list, and end it once the problem is fixed.","asks":["A game is broken right now","A provider is down unexpectedly","The problem is fixed but the game is still in maintenance"],"aka":["emergency","broken game","unplanned","stop maintenance","end maintenance","finish maintenance","start maintenance"],"steps":[{"t":"Find the game in {Game list|遊戲列表} (or the provider in the provider list) and press {Start maintenance now|立即維護} at the end of its row.","shot":{"img":"s20","lb":["Start maintenance now"],"cap":"Game list, filtered to one game","hl":[[86.8,39.5,7.4,5.2]],"w":1440,"h":1000}},{"t":"Once it is fixed, open {Maintenance|維護管理}, find the {In progress|進行中} row, and press {End maintenance|結束維護} in its action cell.","shot":{"img":"s21","lb":["End maintenance"],"cap":"Maintenance list scrolled to the right","hl":[[86.4,44.3,7.7,4.8]],"w":1440,"h":1000}}],"tips":["Only a window still {In progress|進行中} has an End maintenance button. Ended rows offer the bell (notification results) and a view icon only.","In the provider list, a provider under maintenance carries a blue {Under maintenance|維護中} badge, next to green {Enabled|啟用} and red {Disabled|停用}."],"related":["maintenance-scheduled","maintenance-notice","game-off"],"source":"deck slides 20–21"},{"section":"games","id":"maintenance-notice","title":"Did the maintenance notice reach the client?","summary":"Every maintenance window records the notifications sent to clients. Check it, and resend any that failed.","where":"{Maintenance|維護管理} → the window’s bell icon → notification results","asks":["A client says nobody told them about the maintenance","Did the maintenance notification go out?"],"aka":["notification","notice","resend","bell","client informed","not notified"],"steps":[{"t":"In {Maintenance|維護管理}, press the **bell** icon at the end of the window’s row. The notification results open under the row.","shot":{"img":"s22","lb":["Notification results (bell)"],"cap":"Notification results, here in its empty state","hl":[[91.8,41.5,3.4,4.8]],"w":1440,"h":1000}},{"t":"Read the result for each client. If a send **failed**, press **Resend**."}],"tips":["{No data|沒有資料} means no notification was recorded for that window. Read it as “nothing was sent”, not “delivered”."],"related":["maintenance-scheduled","maintenance-unplanned"],"source":"deck slide 22"},{"section":"games","id":"provider-off","title":"Disable a provider","summary":"Turn off a whole studio: for everyone from the provider list, or for one client from that client’s page.","asks":["Stop a provider for all clients","One client doesn’t want this provider any more"],"aka":["turn off provider","remove studio","deactivate provider","inactive","disable studio"],"watch":["!Platform-wide affects **every** client. Double-check before confirming."],"steps":[{"t":"**For everyone:** {Provider list|遊戲供應商列表} → row ⋮ → {Update provider info|更新供應商資訊}. Check the dialog names the right provider ({Editing|編輯對象}), set {Status|狀態} to {Disabled|停用}, and {Save|儲存}.","shot":{"img":"s23","lb":["Status: Disabled"],"cap":"Update provider info, editing Evolution","hl":[[24.9,60.5,50.3,5.3]],"w":1440,"h":1000}},{"t":"A {Confirm information|確認資訊} window repeats what will be saved: status, currencies, countries. Read it, then {Confirm|確認}.","shot":{"img":"s24","lb":["Confirm"],"cap":"Final check before saving","hl":[[49.9,57.3,17.9,6.3]],"w":1440,"h":1000}},{"t":"**For one client only:** open the client’s {Tenant details|租戶詳情} → {Game providers|遊戲供應商} tab and flip that provider’s {Enabled?|是否開啟} switch off.","shot":{"img":"s25","lb":["This client’s provider switch"],"cap":"Tenant detail, Game providers tab","hl":[[26,43.3,4.5,4.9]],"w":1440,"h":1000}}],"tips":["A disabled provider shows a red {Disabled|停用} badge in the provider list, with dashes instead of its currency and country counts."],"related":["switch-levels","game-off","game-off-one-client"],"source":"deck slides 23–25"},{"section":"games","id":"add-game","title":"Add a game by hand","summary":"Providers without an API sync (“Manual” in Last sync) get their games added by hand. A new game starts switched off.","where":"Provider’s game page → {Add game|新增遊戲}","asks":["The provider sent us a new game but it isn’t in the list","How do I add a game?"],"aka":["new game","create game","manual game","game code","manual provider","logo"],"watch":["!The **game code must match the provider’s exactly**."],"steps":[{"t":"In the provider list, check the {Last sync|上次同步} column. {Manual|手動維護} means no API sync, so games are added by hand. API providers have an {Update games|更新遊戲} button instead: see [[sync-update-games]].","shot":{"img":"s26","lb":["Last sync: Manual"],"cap":"Provider list, Last sync column","hl":[[70.7,25.5,5.8,5]],"w":1440,"h":1000}},{"t":"Open the provider’s game page and press {Add game|新增遊戲}.","shot":{"img":"s27","lb":["Add game"],"cap":"Provider game page (Evolution)","hl":[[82.2,26.8,6.8,5.4]],"w":1440,"h":1000}},{"t":"Fill in {Name|名稱}, {Game code|遊戲代碼} and {Provider cost GGR%|供應商成本 GGR%}, and upload the logo. The form also has category, status, devices, currency, target market and a demo switch.","shot":{"img":"s28","lb":["Name","Game code: must match the provider","Provider cost GGR%","Logo upload"],"cap":"Add game form","hl":[[24.3,20.5,25.3,5.2],[49.3,20.5,25.3,5.2],[24.3,42.1,25.3,5.2],[46.1,77.5,6.7,5.2]],"w":1440,"h":1000}},{"t":"{Save|儲存}. A {Created successfully|創建成功} toast confirms it.","shot":{"img":"s29","lb":["Created successfully"],"cap":"Saved; the toast appears top right","hl":[[74,1,25.3,8.1]],"w":1440,"h":1000}},{"t":"The new game appears at the end of the list, **switched off**. Take it through [[enable-game]].","shot":{"img":"s30","lb":["New game: starts off"],"cap":"New game 4770: off, rate 0.01%","hl":[[20.1,61.1,77.6,9.4]],"w":1440,"h":1000}}],"tips":["The logo upload takes JPG, PNG, GIF, WEBP or SVG, up to 10 files."],"related":["enable-game","sync-update-games","reverse-sync"],"source":"deck slides 26–30"},{"section":"games","id":"sync-update-games","title":"Sync games from a provider’s API","summary":"API-synced providers have an Update games button. It shows a preview first; nothing changes until you confirm.","where":"{Provider list|遊戲供應商列表} → {Update games|更新遊戲} on the provider’s row","asks":["The provider added new games","Refresh a provider’s game list","What do the sync counts mean?"],"aka":["refresh games","update games","api sync","new games from provider","preview","sync counts"],"steps":[{"t":"Press {Update games|更新遊戲} on the provider’s row. The row also shows the last result: time, then {Added|新增} · {Fields filled|補欄位} · {Disabled|停用} · {Re-enabled|重啟} · {Errors|異常}, and who ran it.","shot":{"img":"s31","lb":["Update games"],"cap":"Provider list, the ATG row","hl":[[84.5,47.6,7.6,4.8]],"w":1440,"h":1000}},{"t":"Read the **preview**. It counts what the sync would do, including {Added|新增}, {Disabled|停用} and {Unchanged|無變更}. The banner says it plainly: this is a preview and nothing has been written yet.","shot":{"img":"s32","lb":["Added","Disabled","Unchanged"],"cap":"Update games preview: nothing needs to change","hl":[[75,33.5,4,5.1],[75,46,4,5],[74.7,70.8,4.2,5]],"w":1440,"h":1000}},{"t":"Press {Confirm and execute|確認執行}. The system fetches the list again and writes it, so the real result can differ from the preview. A green {Sync complete|同步完成} banner shows what actually happened; then {Close|關閉}.","shot":{"img":"s33","lb":["Close (the result is the green banner)"],"cap":"The actual result after Confirm and execute","hl":[[29.3,85.8,41.4,6.3]],"w":1440,"h":1000}},{"t":"Newly added games arrive **switched off**. Take each one through [[enable-game]] to set its rate."}],"tips":["If the preview would disable many games at once, the [[safety-valve]] holds them back.","Rows reading {Reverse|反串接} have no Update games button; see [[reverse-sync]]. {Not yet synced|尚未同步} means the button has never been used for that provider."],"labels":[["Provider list (games the provider reports)","供應商清單"],["Existing in database","資料庫既有"],["Active","啟用中"],["Added","新增"],["Fields filled","補欄位"],["Disabled","停用"],["Missing, held by the safety valve","缺漏（被安全閥擋下，不停用）"],["Re-enabled","重新啟用"],["Malformed, not written","格式異常（不寫入）"],["Unchanged","無變更"],["Notes","提示"],["Confirm and execute","確認執行"]],"related":["safety-valve","enable-game","add-game","reverse-sync"],"source":"deck slides 31–33"},{"section":"games","id":"safety-valve","title":"The safety valve","summary":"If a sync would disable too many games at once, the system blocks it. Release it only if the provider really retired those games.","asks":["The sync says “Safety valve triggered”","Games are listed as Missing in the sync preview"],"aka":["safety valve","安全閥","too many disabled","missing games","release valve","blocked sync","放行"],"watch":["!Releasing the valve **really does disable** those games, for every client. Not sure? Ask your manager."],"steps":[{"t":"A red {Safety valve triggered|安全閥已觸發} block appears in the Update games preview. In the training example the provider returned **1** game while **6** were active: disabling 5 would exceed the limit (30% of active games, so at most 1 here). The 5 are held under {Missing, held by the safety valve|缺漏（被安全閥擋下，不停用）}.","shot":{"img":"s34","lb":["Safety valve triggered"],"cap":"Update games preview for ATG, valve triggered","hl":[[20.2,24.4,58.7,10.7]],"w":1440,"h":1000}},{"t":"Ask the provider: did they **really retire** those games, or is their list incomplete? The second case is what the valve is for."},{"t":"Only if they really retired them: tick {Release safety valve|放行安全閥} at the bottom of the preview, then {Confirm and execute|確認執行}. The help text says it plainly: once ticked, this sync disables the games in the Missing list.","shot":{"img":"s35","lb":["Release safety valve"],"cap":"Bottom of the preview; unticked by default","hl":[[21,77.9,9.1,5.1]],"w":1440,"h":1000}},{"t":"Otherwise press {Cancel|取消}. Nothing is written and the games stay on."}],"related":["sync-update-games","game-off","never-do"],"source":"deck slides 34–35"},{"section":"games","id":"reverse-sync","title":"Sync a reverse provider’s games","summary":"Providers whose Last sync reads “Reverse” have no Update games button. Their games are synced from the provider detail page.","aka":["reverse","反串接","provider detail","no update button","reverse sync"],"steps":[{"t":"In the provider list, rows reading {Reverse|反串接} show {Provider detail|供應商詳情} instead of Update games. Press it.","shot":{"img":"s36","lb":["Provider detail"],"cap":"Provider list, Reverse rows","hl":[[83.5,47.2,8.9,5.2]],"w":1440,"h":1000}},{"t":"On the detail page, use the {Game list|遊戲列表} card: fetch, review, sync to database. The full steps are in [[rp-sync-games]]."}],"related":["rp-sync-games","sync-update-games","add-game"],"source":"deck slide 36"},{"section":"reverse","id":"rp-overview","title":"The whole flow, start to finish","summary":"A game studio connects to our platform itself. We create it, hand over the connection info, open a Playground for it to test in, then switch it to production and sync its games.","asks":["A new studio wants to integrate with us","Where is this studio in onboarding?"],"aka":["reverse provider onboarding","studio onboarding","new studio","integration steps","overview"],"table":{"head":["Step","What happens","Whose move"],"rows":[["1 · [[rp-create|Create provider]]","We create it in the test back office. The code is permanent.","Us"],["2 · [[rp-connection-info|Hand over connection info]]","Copy the full connection info to the studio’s engineer. The Secret Key goes by a secure channel.","Us"],["3 · [[rp-playground|Enable Playground]]","Copy the delivery package (Access Key and URLs) to the studio.","Us"],["4 · [[rp-progress|Watch progress]]","The studio runs acceptance. Red is theirs to fix.","Them"],["5 · [[rp-leave-sandbox|All green, leave Sandbox]]","Get the production API URL from the studio, then Disable Sandbox.","Us"],["6 · [[rp-sync-games|Sync games]]","Fetch the game list and sync it; then rates and enabling.","Us"],["7 · [[rp-import-test|Import test]]","Launch, bet and settle on XSINO and HeavenOnline before release.","Us"]]},"steps":[{"t":"The provider’s detail page tracks the big stages in {Onboarding progress|對接進度}: {Create provider|建立供應商} → {Deliver connection info, enable Playground|交付接入資訊、開通 Playground} → {Provider self-test acceptance|供應商自測驗收} → {Switch to production, go live|切換正式模式上線}. A yellow “next step” hint underneath says what to do now.","shot":{"img":"s43","lb":["Onboarding progress"],"cap":"Provider detail: steps 1–2 done, step 3 current","hl":[[22.4,30.2,65.5,5.8]],"w":1440,"h":1000}}],"related":["rp-create","rp-progress","rp-leave-sandbox"],"source":"deck slide 39"},{"section":"reverse","id":"rp-create","title":"Create the reverse provider","summary":"Enter name, code and currencies. The API URL and IP whitelist can stay empty: the studio’s engineers fill them in later.","where":"{Games|遊戲} → {Reverse provider list|Reverse 供應商列表} → {Create Reverse provider|新增 Reverse 供應商}","asks":["Set up a new studio in the back office"],"aka":["new studio","add reverse provider","provider code","create studio","reverse provider list"],"watch":["!The **provider code cannot be changed** after creation ({Cannot be modified after creation|建立後不可修改}). Agree it with the studio first."],"steps":[{"t":"Open {Reverse provider list|Reverse 供應商列表} and press {Create Reverse provider|新增 Reverse 供應商}.","shot":{"img":"s40","lb":["Create Reverse provider"],"cap":"Reverse provider list","hl":[[79.4,19.4,13.6,5.4]],"w":1440,"h":1000}},{"t":"Enter {Provider name|供應商名稱}, {Provider code|供應商代碼} and {Available currencies|可用貨幣}. Leave {API URL|API URL} and {IP whitelist|IP_WHITELIST} empty unless you already have them.","shot":{"img":"s41","lb":["Provider name","Provider code: permanent","Currencies"],"cap":"Create Reverse provider dialog","hl":[[31.5,28.6,36.9,5.3],[31.5,35.8,36.9,5.3],[31.5,43,36.9,5.3]],"w":1440,"h":1000}},{"t":"Create it. The Secret Key appears **once**: read [[secret-key]] before you close that window."}],"tips":["The dialog notes that IP verification is not switched on yet; whitelist settings take effect in a future version.","Existing codes are short and lower-case: rectangle, yeebet, vplus."],"related":["secret-key","rp-connection-info","rp-overview"],"source":"deck slides 40–41"},{"section":"reverse","id":"secret-key","title":"The Secret Key: copy once, deliver securely","summary":"A studio’s Secret Key is as sensitive as a password. Copy it when it appears and deliver it only through a secure channel.","asks":["Where do I send the Secret Key?","Can I post the key in the group chat?","The studio needs a new Secret Key"],"aka":["secret key","signing key","regenerate","密鑰","credential delivery","group chat","secure channel","headers"],"watch":["!**Never paste it in a group chat.** Use encrypted email or a password manager."],"steps":[{"t":"The key is shown in full when the provider is created. (The training screenshot is the **regenerate** window, which looks the same.) {Copy full connection info|複製完整接入資訊} copies the Callback URL, provider code, key and headers in one go.","shot":{"img":"s42","lb":["Copy full connection info"],"cap":"Secret Key window. Key and URL covered in this manual.","hl":[[30.4,57,39.2,5.2]],"w":1440,"h":1000}},{"t":"Tick {I have copied and safely saved the above|我已複製並安全保存上述資訊}, then {Confirm|確認}."},{"t":"Deliver it to the studio’s engineer through a **secure channel**: encrypted email or a password manager."}],"tips":["Lost before delivery? {Regenerate Secret Key|重新產生 Secret Key} on the detail page makes a new one, but the **old key stops working immediately** and the studio must switch over. The new key is shown in full only once, so have the delivery channel ready first.","Before regenerating, try {View Secret Key|查看 Secret Key} on the {Credential settings|憑證設定} card. The key window’s own note appears to say the key can be fetched again there without regenerating, but its wording is barely legible in the training screenshot. Confirm with your lead.","The headers block shows what the studio must send with each request: `X-Provider-Code`, `X-Signature` (HMAC-SHA256 of the raw body, keyed with the secret) and `X-Timestamp` (Unix milliseconds)."],"related":["rp-create","rp-connection-info","rp-reissue-key","never-do"],"source":"deck slide 42"},{"section":"reverse","id":"rp-connection-info","title":"Hand over the connection info","summary":"Copy the full connection info from the provider’s detail page and paste it to the studio’s engineer.","where":"Reverse provider detail → {Connection info|接入資訊} card","asks":["The progress bar is at step one","What do I send the studio’s engineer?"],"aka":["connection info","integration details","callback url","hand over","接入資訊","tooltip"],"steps":[{"t":"The detail page opens on the {Onboarding progress|對接進度} bar: four steps, with a yellow “next step” hint saying what to do now.","shot":{"img":"s43","lb":["Onboarding progress"],"cap":"Provider detail","hl":[[22.4,30.2,65.5,5.8]],"w":1440,"h":1000}},{"t":"Scroll to {Connection info|接入資訊} and press {Copy full connection info|複製完整接入資訊}. Paste it to the studio’s engineer.","shot":{"img":"s44","lb":["Copy full connection info"],"cap":"Connection info card. Addresses covered.","hl":[[22.7,43.2,12.4,5.2]],"w":1440,"h":1000}},{"t":"Not sure what a field means? Hover the **?** icons for a plain-language explanation. The Sandbox one reads: Sandbox is a test environment and doesn’t touch real money; production is the real connection; keep Sandbox on until acceptance is all green.","shot":{"img":"s45","lb":["? tooltip"],"cap":"The Sandbox tooltip","hl":[[77.4,48.3,2.4,3.4]],"w":1440,"h":1000}}],"related":["rp-playground","secret-key","rp-overview"],"source":"deck slides 43–45"},{"section":"reverse","id":"rp-playground","title":"Enable Playground for a studio","summary":"Playground is where the studio tests on its own. It needs the provider to be active and in Sandbox mode.","where":"Reverse provider detail → {Playground account|Playground 帳號} card","asks":["The Playground card says prerequisites not met","Give the studio its test access"],"aka":["playground","access key","delivery package","prerequisites not met","test account","enable playground"],"steps":[{"t":"On the {Playground account|Playground 帳號} card, check {Enable prerequisites|開通前置條件}: {Credential status is active|憑證狀態為啟用} and {Credential is in Sandbox mode|憑證處於 Sandbox 模式}. A red mark means not met (here the provider is disabled) and the button stays greyed out.","shot":{"img":"s46","lb":["Prerequisite not met"],"cap":"Prerequisites not met: the provider is disabled","hl":[[22.5,57.3,12.5,4.8]],"w":1440,"h":1000}},{"t":"With both green, press {Enable Playground|開通 Playground}.","shot":{"img":"s47","lb":["Enable Playground"],"cap":"Both prerequisites met","hl":[[22.7,63.2,10.4,5.7]],"w":1440,"h":1000}},{"t":"An Access Key window opens. Press {Copy full delivery package|複製完整交付包} (Access Key, provider code, Playground URL and Callback URL together) and send it to the studio.","shot":{"img":"s48","lb":["Copy full delivery package"],"cap":"Access Key window. Key and URLs covered.","hl":[[30.4,68.3,11.4,5.3]],"w":1440,"h":1000}}],"tips":["Closed the window too early? {View Access Key|查看 Access Key} on the account card brings it back. No need to reissue."],"related":["rp-reissue-key","rp-progress","rp-connection-info"],"source":"deck slides 46–48"},{"section":"reverse","id":"rp-reissue-key","title":"The studio lost its Access Key","summary":"Reissue it from the Playground account card. The old key can no longer sign in.","asks":["The studio says they lost the key","The studio can’t log in to Playground"],"aka":["lost key","forgot key","reissue","new access key","can't log in","login problem"],"steps":[{"t":"First try {View Access Key|查看 Access Key}. If the key is still on record, resend it without reissuing."},{"t":"Otherwise press {Reissue Access Key|重發 Access Key} on the {Playground account|Playground 帳號} card and send the new key in [[rp-playground|the delivery package]].","shot":{"img":"s49","lb":["Reissue Access Key"],"cap":"Playground account card","hl":[[22.7,73,9,4.8]],"w":1440,"h":1000}},{"t":"Warn the studio that the **old key is dead** for new sign-ins."}],"tips":["Reissuing does not end a Playground session that is already logged in (sessions last 24 hours). It only stops the old key from signing in again."],"related":["rp-playground","secret-key"],"source":"deck slide 49"},{"section":"reverse","id":"rp-progress","title":"Watch a studio’s test progress","summary":"The Acceptance status card shows passed and failed counts phase by phase. The full curriculum verdict is the summary.","where":"Reverse provider detail → {Acceptance status|驗收狀態}","asks":["How far along is the studio?","There’s red in the acceptance status","Which studios are still in Sandbox?"],"aka":["acceptance status","progress","phases","verdict","studio testing","red phase","wallet gates"],"steps":[{"t":"Open the {Acceptance status|驗收狀態} card. Each phase shows passed, failed, warning and skipped counts: {Integration setup|整合設定}, {Signature|簽名}, {Game list|遊戲列表}, {Launch game|啟動遊戲}, {Wallet gates M1–M8|錢包關卡}, Freespin, {Reconciliation|對帳}. {Full curriculum verdict|完整課綱判定} at the bottom is the summary.","shot":{"img":"s50","lb":["Full curriculum verdict: Passed"],"cap":"Acceptance status, every phase passed","hl":[[22.7,63.3,10.2,4.4]],"w":1440,"h":1000}},{"t":"For every studio at once, use the {Reverse provider list|Reverse 供應商列表}: the {Sandbox mode|Sandbox 模式} column (Sandbox or {Production|正式}) and the {Playground account|Playground 帳號} column ({Enabled|已開通} or {Not yet enabled|尚未開通}).","shot":{"img":"s52","lb":["Sandbox mode","Playground account"],"cap":"Reverse provider list: every studio’s stage on one page","hl":[[54.1,24.7,8.9,5.7],[66.7,24.7,9.2,5.7]],"w":1440,"h":1000}},{"t":"**Red is theirs to fix.** Send the studio the card. Nothing is needed from us until it is all green."}],"tips":["Until it is ready, a yellow summary counts what is left, for example “3 items left before switching to production: no test game selected, 5 test phases and 8 wallet gates not passed”.","A phase in orange **warning**, such as skipped checks in Launch game, can still sit under a Passed verdict. The verdict is what counts."],"related":["rp-leave-sandbox","colours","rp-playground"],"source":"deck slides 50–52"},{"section":"reverse","id":"rp-leave-sandbox","title":"All green: switch the studio to production","summary":"Once acceptance is all green, get the production API URL from the studio and disable Sandbox.","where":"Reverse provider detail → {Connection info|接入資訊} → {Disable Sandbox|關閉 Sandbox}","asks":["Acceptance is all green, what now?","The system warns acceptance isn’t all green when switching"],"aka":["go live","production","disable sandbox","leave sandbox","switch to production","production url","force"],"watch":["!Without all green the system shows a **yellow warning** but still lets you switch. **Don’t force it** without asking your manager."],"steps":[{"t":"Confirm the {Acceptance status|驗收狀態} card is **all green**. Check it yourself."},{"t":"Get the **production API URL** from the studio."},{"t":"On {Connection info|接入資訊}, press {Disable Sandbox|關閉 Sandbox}.","shot":{"img":"s53","lb":["Disable Sandbox"],"cap":"Connection info, still in Sandbox","hl":[[82.8,20.8,9,5.2]],"w":1440,"h":1000}},{"t":"Replace the {Production API URL|正式 API URL}. It may still hold the sandbox address the studio typed during testing, and after the switch **players’ game launches go straight to this address**. Then {Switch to production mode|切換為正式模式}.","shot":{"img":"s54","lb":["Production API URL: replace it","Switch to production mode"],"cap":"Switch dialog: top on the left, bottom on the right with the not-all-green warning","hl":[[2.6,23.7,44.8,6.2],[73.8,89.1,22.5,7.1]],"w":1440,"h":854}},{"t":"All four progress steps are ticked and a green banner reads {This provider has switched to production; onboarding complete|此供應商已切換正式模式，對接完成。}.","shot":{"img":"s55","hl":[[23.2,35.2,68.2,6.2]],"lb":["Onboarding complete"],"cap":"Onboarding complete","w":1440,"h":1000}}],"tips":["A ticked last step does **not** prove acceptance passed: the system allows the switch before all green. Check the acceptance card, not the progress bar.","Forcing the switch does not make Freespin usable. Freespin still needs a valid Phase 4 verification, and the client’s credential must also be authorised for it."],"related":["rp-progress","rp-sync-games","never-do"],"source":"deck slides 53–55"},{"section":"reverse","id":"rp-sync-games","title":"Sync a studio’s games to our platform","summary":"Fetch the studio’s game list on its detail page, review the preview, then sync to database. New games arrive switched off.","where":"Reverse provider detail → {Game list|遊戲列表} card","asks":["Onboarding is complete, how do the games get in?","The studio added games"],"aka":["sync games","fetch game list","sync to database","import games","re-fetch"],"steps":[{"t":"On the {Game list|遊戲列表} card, fetch the list ({Re-fetch|重新拉取}) and review the preview table. A blue banner says it is preview data, not yet synced.","shot":{"img":"s56","lb":["Sync to database"],"cap":"Game list card: 25 games in preview","hl":[[81.1,9.2,11,6.1]],"w":1440,"h":1000}},{"t":"Press {Sync to database|同步至資料庫} and confirm: “About to sync 25 games to the database. New games default to disabled. Continue?”","shot":{"img":"s57","lb":["Confirmation message"],"cap":"Sync confirmation","hl":[[37.4,46.9,25.3,7.7]],"w":1440,"h":1000}},{"t":"A green banner reports the result, e.g. “Sync complete. 4 added, 21 updated”, and reminds you new games are disabled: set their rates and enable them on the game management page.","shot":{"img":"s58","lb":["Sync complete"],"cap":"After the sync","hl":[[23.5,15.6,67.5,6.9]],"w":1440,"h":1000}},{"t":"Take each new game through [[enable-game]]: rate first, then the switch. Then the [[rp-import-test|import test]]."}],"related":["enable-game","rp-import-test","reverse-sync"],"source":"deck slides 56–58"},{"section":"reverse","id":"rp-import-test","title":"Import test before release","summary":"Before clients get a new studio’s games, prove they work on our own platforms.","aka":["import test","xsino","heavenonline","heaven online","release games","launch bet settle"],"steps":[{"t":"Import the games on our **XSINO** and **HeavenOnline** platforms."},{"t":"Confirm each one **launches, accepts bets, and settles**."},{"t":"**Release to clients only after the test passes.**"}],"related":["rp-sync-games","enable-game"],"source":"deck slide 59"},{"section":"clients","id":"client-overview","title":"The whole flow, start to finish","summary":"A client (tenant) connects to our games. We create it and its credential in test, the client tests itself in Playground until all green, we check, and only then do we issue the production credential, in production.","asks":["A new client is signing on","Where is this client in onboarding?"],"aka":["client onboarding","aggregation client","new client","onboarding steps","overview","tenant onboarding"],"table":{"head":["Step","What happens","Whose move"],"rows":[["1 · [[create-tenant|Create tenant]]","Name, time zone, currencies. Confirm the time zone with the client.","Us"],["2 · [[tenant-prerequisites|Complete prerequisites]]","A tenant user and an agent, until the health dashboard is clear.","Us"],["3 · [[create-credential|Create credential]]","Wallet mode, webhook URL, IP whitelist. Then [[deliver-credential|deliver it]].","Us"],["4 · [[client-playground|Enable Playground]]","Copy the login info to the client before closing the window.","Us"],["5 · [[check-result|Client tests to all green]]","The client runs acceptance L0–L5. Red is theirs to fix.","Them"],["6 · [[production-credential|Production credential]]","In the production back office, only after all green.","Us"]]},"related":["create-tenant","check-result","production-credential"],"source":"deck slide 62"},{"section":"clients","id":"create-tenant","title":"Create the tenant","summary":"Only the brand name is needed to create it; time zone, language and status come pre-filled. Check the time zone with the client before saving.","where":"{Tenants|租戶} → {Create new tenant|建立新租戶}","asks":["Set up a new client","Which time zone should the client have?"],"aka":["new client","new tenant","new operator","time zone","cut-off","brand name","create tenant"],"watch":["!The **time zone sets the daily cut-off in reports**. It defaults to UTC+0: confirm it with the client."],"steps":[{"t":"Open {Tenants|租戶} → {Create new tenant|建立新租戶}.","shot":{"img":"s63","lb":["Create new tenant"],"cap":"Create new tenant form","hl":[[2.3,26.3,9.4,5.1]],"w":1440,"h":1000}},{"t":"Enter {Name|名稱} (the brand name) and set {Time zone|時區}, {Language|語言} and {Currency|貨幣}.","shot":{"img":"s64","lb":["Name","Time zone: confirm with the client","Currency"],"cap":"Name, time zone, currency","hl":[[22,39.4,60.4,5.4],[22,58.7,30.4,5.4],[52,65.9,30.4,5.4]],"w":1440,"h":1000}},{"t":"Save. Optional fields (target market, {Licence|憑證} such as Curaçao, {Role|角色} such as Whitelabel) can be added later with Edit."}],"tips":["{Required|必填}: name, time zone, language, status. Defaults: UTC+0, English, Enabled. {Optional|選填}: target market, currency, licence, role."],"related":["tenant-prerequisites","client-overview"],"source":"deck slides 63–64"},{"section":"clients","id":"tenant-prerequisites","title":"Complete the tenant’s prerequisites","summary":"The health dashboard on the tenant’s Overview lists what is missing. Create a tenant user and an agent; the agent’s API keys turn Ready once its credential exists.","where":"Tenant detail → {Overview|總覽} → {Health dashboard|健康度儀表板}","asks":["Red text on the tenant’s health card","The agent’s API keys say Missing"],"aka":["health dashboard","missing","agent","tenant user","api keys missing","needs attention","go to fix"],"steps":[{"t":"On {Overview|總覽}, the {Health dashboard|健康度儀表板} lists what still needs doing under {Needs attention|需要處理}, for example “agent user missing”. {Go to fix|前往處理} jumps to the right place.","shot":{"img":"s65","lb":["Go to fix"],"cap":"Tenant overview with the health dashboard","hl":[[86.7,50.2,6.1,4.8]],"w":1440,"h":1000}},{"t":"{Tenant users|租戶使用者} tab → {Create|創建}: name and status. The password is generated for you. **Copy it first**: it can’t be viewed again once you leave the page.","shot":{"img":"s66","lb":["Create"],"cap":"Create user. Password covered.","hl":[[49.9,63.5,17.2,6.3]],"w":1440,"h":1000}},{"t":"{Agents|代理商} tab → {Add agent|新增代理商}: name and status, then {Create|創建}.","shot":{"img":"s67","lb":["Create"],"cap":"Add agent","hl":[[49.9,55.3,17.2,6.3]],"w":1440,"h":1000}},{"t":"In the agent list, the {API keys|API 金鑰} column starts at orange {Not created|未建立} (the training calls it “Missing”). It turns green {Created|已建立} (“Ready”) once [[create-credential|the credential]] exists.","pair":[{"img":"s68","lb":["API keys: Not created"],"cap":"New agent 23","hl":[[69.8,52.4,14,7.2]],"w":1440,"h":1000},{"img":"s69","lb":["API keys: Created"],"cap":"The same agent after its credential was made","hl":[[69.8,52.4,14,7.2]],"w":1440,"h":1000}]}],"tips":["The tiles at the top count agents, tenant users, API keys (ready / total) and providers."],"related":["create-credential","create-tenant"],"source":"deck slides 65–69"},{"section":"clients","id":"create-credential","title":"Create the client’s credential","summary":"Each agent gets an API credential: choose the wallet mode and enter the client’s webhook URL. Once it exists, the Playground section appears on the credential page.","where":"Tenant detail → {Agents|代理商} → the agent’s Credential button","asks":["The credential page is empty","Where do I put the client’s webhook URL and IPs?"],"aka":["credential","api credential","webhook","wallet mode","ip whitelist","empty credential page","go to create"],"steps":[{"t":"In the agent list, press the agent’s **Credential** button (one of the icons on its row). An empty page says {No API credential created yet|尚未創建API憑證}. Press {Go to create|前往創建}.","shot":{"img":"s70","lb":["Go to create"],"cap":"Empty credential page for agent 23","hl":[[54.4,41.6,6.7,5.2]],"w":1440,"h":1000}},{"t":"Fill in {Webhook URL|Webhook 網址}, {Status|狀態}, {Wallet mode|錢包模式} (e.g. {Cash wallet|現金錢包}) and the client’s {IP whitelist|白名單IP} (several IPs separated by commas), then {Create|創建}.","shot":{"img":"s71","lb":["Wallet mode","Create"],"cap":"Add agent API credential, with example values","hl":[[24.9,46,50.3,5.2],[49.9,73,17.2,6.2]],"w":1440,"h":1000}},{"t":"The {Wallet Acceptance Playground|Wallet 驗收 Playground} section now appears at the top of the credential page, in the test environment only.","shot":{"img":"s72","lb":["Wallet Acceptance Playground"],"cap":"Credential page: Playground section, not enabled yet","hl":[[20.4,23,13.8,4.4]],"w":1440,"h":1000}}],"tips":["Pick the wallet mode the client integrated against. Only {Cash wallet|現金錢包} appears in the training; ask if the client mentions anything else."],"related":["deliver-credential","client-playground","tenant-prerequisites"],"source":"deck slides 70–72"},{"section":"clients","id":"deliver-credential","title":"Deliver the credential","summary":"Email the credential to your own work inbox (or copy it), then pass it to the client.","where":"Credential page → {Send API credential notification|發送API憑證通知}","asks":["How does the client get its credential?"],"aka":["send credential","email credential","deliver","notification","recipient"],"steps":[{"t":"On the credential page, open {Send API credential notification|發送API憑證通知}. Add **your own work email** under {Recipients|收件人} with {Add|新增}, then {Send|發送}. Or copy the credential instead.","shot":{"img":"s73","lb":["Recipient email"],"cap":"Send API credential notification","hl":[[3.2,62.4,80.3,10.4]],"w":1440,"h":853}},{"t":"Deliver it to the client."}],"tips":["The client back office isn’t ready yet, so **operations staff** currently handle delivery.","Recipients can also be picked from the tenant’s users, agent users or saved contacts. The training sends to your own inbox first."],"related":["create-credential","production-credential","secret-key"],"source":"deck slide 73"},{"section":"clients","id":"client-playground","title":"Enable Playground for a client","summary":"One click generates the client’s Playground login. Copy the login info before closing: the password is shown only once.","where":"Credential page → yellow hint → {Enable Playground|開通 Playground}","asks":["The client needs its test login","Yellow box in the progress section","Grey “Not enabled”"],"aka":["playground login","initial password","username","copy login info","account created","not enabled","未開通"],"steps":[{"t":"The yellow hint on the credential page reads: “Next step: press Enable Playground to generate the login account, then hand the URL, account and initial password to the client together.” Press {Enable Playground|開通 Playground} inside it.","shot":{"img":"s74","lb":["Enable Playground"],"cap":"Credential page: Playground not enabled","hl":[[25.3,40.6,10.1,5.5]],"w":1440,"h":1000}},{"t":"Confirm. The username is generated automatically (tenant + agent + random code). The initial password is generated and shown once; the client must change it at first login.","shot":{"img":"s75","lb":["Enable Playground (confirm)"],"cap":"Enable Playground confirmation","hl":[[56.6,61.3,10.2,5.3]],"w":1440,"h":1000}},{"t":"In the {Account created|帳號已建立} window, press {Copy login info|複製登入資訊} **before** {Confirm|確認}.","shot":{"img":"s76","lb":["Copy login info"],"cap":"Account created. URL, username and password covered.","hl":[[31,64,10.4,5.3]],"w":1440,"h":1000}},{"t":"Paste the four lines (URL, Operator, Username, Password) to the client as they are.","shot":{"img":"s77","lb":[],"cap":"The copied lines in a notepad, password masked","hl":[],"w":1440,"h":1000}}],"tips":["The initial password can be delivered again later only if it was saved, the client hasn’t changed it, and you have reset-password permission. It is masked by default."],"related":["client-not-started","check-result","create-credential"],"source":"deck slides 74–77"},{"section":"clients","id":"client-not-started","title":"The client hasn’t started testing","summary":"“Never run” means the account exists but the client hasn’t run acceptance. Copy the connection info and remind them.","asks":["The client hasn’t tested yet","The client lost the Playground password","The client changed the password and needs it again","The client can’t log in"],"aka":["never run","從未執行","client not started","remind client","chase","reset password","locked","can't log in"],"steps":[{"t":"The badge reads {Never run|從未執行}. Press {Copy connection info|複製接入資訊} and send it as a reminder to log in and run the full L0–L5 verification. Until it is all green, nothing is needed from us.","shot":{"img":"s78","lb":["Copy connection info"],"cap":"Credential page: never run","hl":[[24.9,40.9,9.3,4.8]],"w":1440,"h":1000}},{"t":"If an initial password is still available, a **Password** line follows Username in what you copy. Otherwise the copy is three lines."},{"t":"If {Initial password|初始密碼} reads {Changed by the client; reset required for redelivery|客戶已自行變更，需重設密碼方可再交付。}, the client set their own. **Reset only when needed**: {Reset password|重設密碼}.","shot":{"img":"s79","lb":["Reset password"],"cap":"Initial password already changed by the client","hl":[[28.9,57.8,7.6,4.8]],"w":1440,"h":1000}}],"tips":["The account block also shows {Lock status|鎖定狀態}, the count of failed logins. Look there first when a client says they can’t log in."],"related":["client-playground","check-result","all-clients-status"],"source":"deck slides 78–79"},{"section":"clients","id":"check-result","title":"The client says it’s done: check the colour","summary":"Don’t take their word for it. Red “Failed” means not done: send the report. Green “All green” means QA passed.","where":"Credential page → the Playground section’s badge","asks":["The client says testing is finished","The client says they passed"],"aka":["client done","finished testing","failed","未通過","all green","全綠通過","passed","view report"],"steps":[{"t":"Red {Failed|未通過}: not done. The hint counts the failing cases (e.g. 6 of 69) and says not to create the production credential until all green. Press {View report|檢視報告} and send it to the client’s engineer.","shot":{"img":"s80","lb":["View report"],"cap":"Credential page: the latest run failed","hl":[[24.7,40.6,8.3,5.7]],"w":1440,"h":1000}},{"t":"Green {All green passed|全綠通過}: QA passed. The hint says to go to the **production** back office and create the production credential. Playground exists only in test, so there is nothing more to do here.","shot":{"img":"s81","lb":["All green"],"cap":"Credential page: all green, 69 of 69","hl":[[24.7,38,67.5,4.9]],"w":1440,"h":1000}}],"related":["read-report","production-credential","colours"],"source":"deck slides 80–81"},{"section":"clients","id":"read-report","title":"Read an acceptance report","summary":"Top half: who and what was tested. Bottom half: which level failed. Fix the blocking level first.","where":"Credential page → {View report|檢視報告}, or {Manage|管理} → {Playground acceptance|Playground 驗收管理}","asks":["What does this report mean?","The report is full of grey Skipped","The client asks why it failed"],"aka":["report","blocking level","阻塞層","skipped","failure reason","L0","timeout","verification report"],"steps":[{"t":"**Top half:** status label, counts, and the test details: test player, currency, test game, start and end time. Compare them with what the client told you.","shot":{"img":"s82","lb":["Status: Failed"],"cap":"Verification report, Run #1","hl":[[27.7,26.4,5.6,5.3]],"w":1440,"h":1000}},{"t":"**Bottom half:** levels L0, L1 and onward, each with passed, failed and skipped counts. The level tagged {Blocking level|阻塞層} is where a failure stopped the run. **Fix that first.**","shot":{"img":"s83","lb":["Blocking level"],"cap":"L0 failed 6; L1 blocked","hl":[[22.4,85.9,5.3,4.9]],"w":1440,"h":1000}},{"t":"Expand a failed case to see the {Failure reason|失敗原因}, the request we sent and the client’s response. That is what their engineer needs.","shot":{"img":"s84","lb":["Failure reason"],"cap":"Expanded case L0-001: request failed","hl":[[21.9,13.6,71.5,8.1]],"w":1440,"h":1000}}],"tips":["Grey {Skipped|跳過} is **not** a failure: an earlier failure blocked it. Fix the failures, re-run, and the skipped cases will run.","In the training example every L0 case took about 10 seconds and the response was an i/o timeout: the client’s server never answered our request. That is on their side."],"related":["check-result","all-clients-status"],"source":"deck slides 82–84"},{"section":"clients","id":"all-clients-status","title":"Every client’s test status on one page","summary":"Playground acceptance lists every client credential with a colour-coded status. Use it to find who is stuck.","where":"{Manage|管理} → {Playground acceptance|Playground 驗收管理}","asks":["Which clients are stuck in testing?","What does each status mean?"],"aka":["playground acceptance","status","stuck clients","overview","all clients","verifying","aborted"],"steps":[{"t":"Open {Playground acceptance|Playground 驗收管理}. Filter by {Verification status|驗證狀態} or search by keyword.","shot":{"img":"s85","lb":["Status column"],"cap":"Playground acceptance. Usernames and keys covered.","hl":[[45.4,47.8,8.7,25.7]],"w":1440,"h":1000}}],"table":{"head":["Status","Me <script>
// Back-office manual — renders window.MANUAL (content/manual.json, inlined by build.mjs).
// Routes: #/  ·  #/t/<topic>  ·  #/s/<section>  ·  #/search/<query>  ·  #/glossary  ·  #/situations
(() => {
const M = window.MANUAL;
const html = document.documentElement;
const $ = (s, r = document) => r.querySelector(s);
const T = Object.fromEntries(M.topics.map(t => [t.id, t]));
const S = Object.fromEntries(M.sections.map(s => [s.id, s]));
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

// ---------- inline markup ----------
// **bold**  `code`  {English|中文} = a back-office label  [[topic-id]] or [[topic-id|text]] = link
function md(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/\{([^|{}]+)\|([^{}]+)\}/g, '<span class="ui">$1<span class="uz">$2</span></span>')
    .replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, txt) =>

}
const plain = s => String(s ?? "")
  .replace(/\{([^|{}]+)\|([^{}]+)\}/g, "$1 $2")
  .replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, txt) => txt || (T[id] ? T[id].title : ""))
  .replace(/[*`]/g, "");

// ---------- search ----------
const STOP = new Set("a an the and or of to in on for is it be do i my we our you your can how what when where why which who this that with from at as by are was not no if then its into me us".split(" "));
// what people type → the words the manual uses
const SYN = {
  off: ["disabl"], hide: ["disabl"], remov: ["disabl"], stop: ["disabl", "maintenanc"], block: ["disabl"],
  on: ["enabl"], activ: ["enabl"], show: ["enabl"], launch: ["enabl"], open: ["enabl"],
  client: ["tenant", "operator"], customer: ["tenant"], operator: ["tenant"], merchant: ["tenant"], brand: ["agent"], site: ["agent"],
  studio: ["provider"], vendor: ["provider"], supplier: ["provider"], slot: ["game"],
  key: ["credential", "secret"], password: ["credential", "playground"], login: ["playground", "credential"], token: ["credential", "secret"],
  down: ["maintenanc"], outag: ["maintenanc"], broken: ["maintenanc"], fix: ["maintenanc"],
  test: ["sandbox", "playground", "acceptanc"], qa: ["acceptanc"], pass: ["green"], fail: ["red", "report"],
  live: ["production"], prod: ["production"], real: ["production"],
  rate: ["ggr"], cost: ["rate", "ggr"], price: ["rate"], commission: ["rate", "markup"],
  new: ["add", "creat"], make: ["creat"], setup: ["creat", "onboard"], onboard: ["creat"],
  sync: ["updat"], import: ["sync"], refresh: ["sync", "updat"], pull: ["sync"],
  lost: ["reissu", "regenerat"], forgot: ["reissu", "reset"], miss: ["lost", "unset"],
  see: ["enabl", "client-sid"], visibl: ["enabl"], cant: ["disabl", "client-sid"],
};
const stem = w => w.length > 4 ? w.replace(/(ings?|ed|es|e|s)$/, "") : w;
function toks(s) {
  s = plain(s).toLowerCase().normalize("NFKC").replace(/can['’]?t|cannot/g, "cant ");
  const out = [];
  for (const w of s.match(/[a-z0-9]+(?:-[a-z0-9]+)*/g) || []) {
    for (const p of w.split("-").concat(w.includes("-") ? [w] : [])) if (!STOP.has(p)) out.push(stem(p));
  }
  for (const run of s.match(/[㐀-鿿]+/g) || []) {
    if (run.length === 1) out.push(run);
    for (let i = 0; i < run.length - 1; i++) out.push(run.slice(i, i + 2));
  }
  return out;
}
function textOfTopic(t) {
  const parts = [t.summary, ...(t.steps || []).map(x => x.t), ...(t.watch || []), ...(t.tips || [])];
  for (const st of t.steps || []) for (const sh of [].concat(st.shot || [], st.pair || [])) parts.push(sh.cap, ...(sh.lb || []));
  return parts.join(" ");
}
const DOCS = [];
for (const t of M.topics) DOCS.push({ kind: "topic", id: t.id, sec: t.section, title: t.title, href: `#/t/${t.id}`,
  snip: t.summary, fields: [[t.title, 6], [(t.asks || []).join(" "), 4], [(t.aka || []).join(" "), 4],
    [(t.labels || []).map(l => l.join(" ")).join(" "), 3], [t.summary, 2], [textOfTopic(t), 1]] });
M.situations.forEach((s, i) => DOCS.push({ kind: "sit", id: "sit" + i, sec: T[s.topic]?.section, title: s.see,
  href: `#/t/${s.topic}`, snip: s.do, fields: [[s.see, 5], [s.do, 2], [T[s.topic]?.title || "", 1]] }));
M.glossary.forEach((g, i) => DOCS.push({ kind: "term", id: "g" + i, title: g.term, href: `#/glossary/${i}`,
  snip: g.plain, fields: [[g.term + " " + (g.zh || ""), 6], [g.plain, 2], [g.note || "", 1]] }));
const DF = {};
for (const d of DOCS) {
  d.w = new Map();
  for (const [txt, wt] of d.fields) for (const k of toks(txt)) d.w.set(k, Math.max(d.w.get(k) || 0, wt));
  for (const k of d.w.keys()) DF[k] = (DF[k] || 0) + 1;
}
const idf = k => Math.log(1 + DOCS.length / (1 + (DF[k] || 0)));
// rank() keeps each hit's score and coverage (share of query words matched); search() is the plain list. The chat widget (bot.js) reads the scores.
const search = q => rank(q).map(x => x.d);
function rank(q) {
  const qt = [...new Set(toks(q))];
  if (!qt.length) return [];
  const last = toks(q).at(-1);
  const scored = [];
  for (const d of DOCS) {
    let sc = 0, hit = 0;
    for (const k of qt) {
      let best = d.w.get(k) ? d.w.get(k) * idf(k) : 0;
      for (const alt of SYN[k] || []) if (d.w.get(alt)) best = Math.max(best, d.w.get(alt) * idf(alt) * 0.7);
      if (!best && k === last && k.length >= 2) for (const [dk, wt] of d.w) if (dk.startsWith(k)) best = Math.max(best, wt * idf(dk) * 0.6);
      if (!best && k.length >= 4) for (const [dk, wt] of d.w) if (dk.length >= 4 && (dk.startsWith(k) || k.startsWith(dk))) best = Math.max(best, wt * idf(dk) * 0.5);
      if (best) { sc += best; hit++; }
    }
    if (!hit) continue;
    const cov = hit / qt.length;
    if (qt.length >= 3 && cov < 0.34) continue;
    sc *= cov * cov * (d.kind === "topic" ? 1 : d.kind === "sit" ? 0.95 : 0.8);
    scored.push({ d, sc, cov });
  }
  return scored.sort((a, b) => b.sc - a.sc);
}
// question words the manual never uses, not even through a synonym or inside a longer word: the bot names these instead of guessing
const DFK = Object.keys(DF);
function unknownWords(q) {
  const s = plain(q).toLowerCase().normalize("NFKC");
  return [...new Set(s.match(/[a-z][a-z0-9]{2,}/g) || [])].filter(w => {
    if (STOP.has(w)) return false;
    const k = stem(w);
    return !(DF[k] || (SYN[k] || []).some(a => DF[a])
      || (k.length >= 4 && DFK.some(dk => dk.length >= 4 && (dk.startsWith(k) || k.startsWith(dk)))));
  });
}
function hiLite(s, q) {
  const words = (q.toLowerCase().match(/[a-z0-9]{3,}|[㐀-鿿]{2,}/g) || []).map(w => w.length > 4 ? w.slice(0, -1) : w);
  let out = esc(plain(s));
  // the stem plus the rest of its word, so "secret" marks the whole word and not "secre"
  for (const w of words) out = out.replace(new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}[a-z]*)`, "gi"), "<mark>$1</mark>");
  return out;
}
const badge = d => d.kind === "sit" ? '<span class="badge sit">Situation</span>'
  : d.kind === "term" ? '<span class="badge term">Term</span>'
  : `<span class="badge" data-sec="${d.sec}">${esc(S[d.sec]?.short || "")}</span>`;

// ---------- screenshots with numbered red markers (same contract as _base.js: data-hl in % of the image) ----------
function figure(sh, tag) {
  const hl = (sh.hl || []).map(b => b.join(",")).join("|");
  return `<figure class="shot${(sh.hl || []).length >= 3 ? " dense" : ""}"><img src="img/${esc(sh.img)}.webp" alt="${esc(plain(sh.cap || ""))}" loading="lazy"${sh.w ? ` width="${sh.w}" height="${sh.h}"` : ""}
    ${hl ? `data-hl="${hl}" data-lb="${esc((sh.lb || []).map(plain).join("|"))}"` : ""}>
    <figcaption>${tag ? `<span class="tag ${tag === "After" ? "after" : ""}">${tag}</span>` : ""}${md(sh.cap || "")}</figcaption></figure>`;
}
function markShots(root) {
  root.querySelectorAll(".shot img[data-hl]").forEach(img => {
    const f = document.createElement("div"); f.className = "frame"; img.replaceWith(f);
    const cv = document.createElement("div"); cv.className = "canvas"; f.appendChild(cv); cv.appendChild(img);
    const labels = (img.dataset.lb || "").split("|");
    img.dataset.hl.split("|").forEach((box, n) => {
      const c = box.endsWith("c"); const [l, t, w, h] = box.replace("c", "").split(",").map(Number);
      const m = document.createElement("i"); m.className = "hl" + (c ? " c" : ""); m.dataset.n = n + 1;
      m.style.cssText = `left:${l}%;top:${t}%;width:${w}%;height:${h}%`; cv.appendChild(m);
      const txt = labels[n]; if (!txt) return;
      const g = document.createElement("i"); g.className = "lbl"; g.textContent = txt;
      if (l + w / 2 > 55) g.style.right = (100 - (l + w)) + "%"; else g.style.left = l + "%";
      if (t > 14) { g.style.bottom = (100 - t) + "%"; g.style.marginBottom = "max(4px,.7cqw)"; g.dataset.dir = "up"; }
      else { g.style.top = (t + h) + "%"; g.style.marginTop = "max(4px,.7cqw)"; g.dataset.dir = "down"; }
      cv.appendChild(g);
    });
    if (labels.filter(Boolean).length) {
      const k = document.createElement("ol"); k.className = "lblkey";
      labels.forEach(x => { if (!x) return; const li = document.createElement("li"); li.textContent = x; k.appendChild(li); });
      f.appendChild(k);
    }
  });
  root.querySelectorAll(".shot img").forEach(i => i.onclick = () => {
    const lb = $("#lightbox"); lb.innerHTML = "";
    const c = (i.closest(".frame") || i).cloneNode(true);
    c.style.cssText = "max-width:96vw;max-height:96vh;width:min(96vw,1400px)"; lb.appendChild(c); lb.style.display = "flex";
  });
  root.querySelectorAll(".frame img").forEach(im => im.complete ? null : im.addEventListener("load", reflow));
  reflow();
}
// push apart label pills that landed on top of each other
function fixLabels() {
  document.querySelectorAll(".canvas").forEach(f => {
    const fr = f.getBoundingClientRect(); if (!fr.height) return;
    const ls = [...f.querySelectorAll(".lbl")];
    ls.forEach(e => { e.style.transform = ""; e._dy = 0; });
    for (let i = 1; i < ls.length; i++) {
      const e = ls[i]; const r0 = e.getBoundingClientRect(); if (!r0.width) continue;
      let dir = e.dataset.dir === "down" ? 1 : -1;
      if (dir < 0 && r0.top - (r0.height + 10) < fr.top) dir = 1;
      else if (dir > 0 && r0.bottom + (r0.height + 10) > fr.bottom) dir = -1;
      for (let g = 0; g < 6; g++) {
        const a = e.getBoundingClientRect();
        const hit = ls.slice(0, i).some(o => { const b = o.getBoundingClientRect();
