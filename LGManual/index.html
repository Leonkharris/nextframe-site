<!DOCTYPE html>
<html lang="en" class="lang-en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Back-Office Manual · Lucifer Gaming</title>
<style>
:root{
    --ink:#eef2f7;--ink2:#c5cedb;--muted:#8d99ad;--line:#2a3448;--bg:#0d1219;--card:#161d29;--card2:#1e2735;--chip:#273246;
    --green:#22c38a;--green-d:#5ee0a8;--green-s:#0f3327;
    --blue:#6b9dff;--blue-s:#172a4d;      /* merchant backend */
    --purple:#b48cff;--purple-s:#2a1f4d;  /* admin backend */
    --orange:#f5a15a;--orange-s:#3d2410;  /* cobo */
    --red:#ff6b6b;--red-s:#3d1a1a;--amber:#f2b64a;--amber-s:#3a2c10;
    --r:16px;--sh:0 10px 30px rgba(0,0,0,.35)
  }
  html.theme-light{
    --ink:#0f1726;--ink2:#3b4658;--muted:#6b7686;--line:#dfe4ec;--bg:#eef1f6;--card:#fff;--card2:#f5f7fb;--chip:#e6ebf3;
    --green:#0e9f6e;--green-d:#0b7a55;--green-s:#e3f7ee;
    --blue:#2563eb;--blue-s:#e8efff;--purple:#7c3aed;--purple-s:#f1e9ff;--orange:#ea7a1a;--orange-s:#fff1e3;
    --red:#dc2626;--red-s:#fdeaea;--amber:#d98a00;--amber-s:#fff7e0;--sh:0 10px 30px rgba(15,23,38,.10)
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  a{color:var(--green-d)}
  .lang-en .zh{display:none!important}.lang-zh .en{display:none!important}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* language switch */
  .langbar{position:fixed;top:14px;right:18px;z-index:60;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .langbar button{border:0;background:transparent;padding:7px 15px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted);font-size:13px}
  .lang-en .langbar [data-lang=en],.lang-zh .langbar [data-lang=zh],.langbar [data-theme].on{background:var(--green);color:#06281c}
  .langbar .sep{width:1px;background:var(--line);margin:4px 2px}

  /* hero */
  .hero{background:radial-gradient(1200px 500px at 20% -10%,#1b6b52 0%,#0a0f18 55%);color:#fff;padding:72px 0 56px}
  .hero h1{font-size:clamp(30px,4.6vw,52px);line-height:1.05;margin:0 0 14px;letter-spacing:-.02em;color:#fff}
  .hero h1 em{font-style:normal;color:#5ee0a8}
  .hero p{font-size:18px;max-width:720px;opacity:.9;margin:0 0 30px;color:#e6edf5}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:16px 18px}
  .kpi b{display:block;font-size:34px;line-height:1;color:#5ee0a8;letter-spacing:-.02em}
  .kpi span{display:block;font-size:13px;opacity:.85;margin-top:6px}

  /* section chrome */
  section{padding:56px 0 8px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .eyebrow i:not([class]){width:10px;height:10px;border-radius:3px;background:var(--green);display:inline-block}
  .m .eyebrow i:not([class]){background:var(--blue)}.a .eyebrow i:not([class]){background:var(--purple)}.c .eyebrow i:not([class]){background:var(--orange)}
  h2{font-size:clamp(26px,3vw,36px);letter-spacing:-.02em;margin:8px 0 6px;line-height:1.1}
  .lead{color:var(--ink2);font-size:17px;max-width:800px;margin:0 0 26px}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:26px}

  /* system map */
  .map{display:grid;grid-template-columns:1fr 60px 1.4fr 60px 1fr;align-items:center;gap:0}
  .map .col{display:flex;flex-direction:column;gap:12px}
  .box{border-radius:14px;padding:16px 18px;border:2px solid var(--line);background:var(--card2)}
  .box b{display:block;font-size:16px}
  .box small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}
  .box.m{border-color:var(--blue);background:var(--blue-s)}.box.a{border-color:var(--purple);background:var(--purple-s)}.box.c{border-color:var(--orange);background:var(--orange-s)}.box.g{border-color:var(--green);background:var(--green-s)}
  .box.core{padding:20px}
  .box.core .sub-boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .arrow{display:flex;align-items:center;justify-content:center;color:#a5adbb}
  .arrow svg{width:44px;height:24px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--muted)}
  .legend i:not([class]){display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}

  /* timeline */
  .timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;margin-top:10px}
  .timeline::before{content:"";position:absolute;left:8%;right:8%;top:38px;height:4px;background:linear-gradient(90deg,var(--blue),var(--green),var(--purple),var(--orange));border-radius:2px}
  .tl{position:relative;padding:0 10px;text-align:center}
  .tl .n{width:76px;height:76px;border-radius:50%;background:var(--card2);border:4px solid var(--green);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;z-index:1;box-shadow:var(--sh)}
  .tl b{display:block;font-size:16px;margin-bottom:4px}
  .tl p{margin:0;color:var(--ink2);font-size:14px}
  .tl .who{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
  .who.m{background:var(--blue-s);color:var(--blue)}.who.a{background:var(--purple-s);color:var(--purple)}.who.c{background:var(--orange-s);color:var(--orange)}.who.g{background:var(--green-s);color:var(--green-d)}
  .tl:nth-child(1) .n{border-color:var(--blue)}.tl:nth-child(4) .n{border-color:var(--blue)}.tl:nth-child(5) .n{border-color:var(--purple)}

  /* status lifecycle */
  .life{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pill{padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}
  .p-wait{background:var(--amber-s);color:var(--amber)}.p-run{background:var(--blue-s);color:var(--blue)}.p-ok{background:var(--green-s);color:var(--green-d)}.p-bad{background:var(--red-s);color:var(--red)}
  .life .ar{color:#a5adbb;font-size:20px}

  /* compare */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .cmp{border-radius:var(--r);padding:22px;border:2px solid var(--line);background:var(--card)}
  .cmp h3{margin:0 0 4px;font-size:22px}
  .cmp .tagline{color:var(--muted);margin:0 0 14px}
  .cmp ul{list-style:none;padding:0;margin:0}
  /* block, not flex: a flex <li> turns every <b>/<i>/<code> inside it into its own
     flex item, which gaps the sentence apart and breaks it in the wrong places */
  .cmp li{padding:7px 0 7px 24px;border-top:1px dashed var(--line);position:relative}
  .cmp li::before{content:"✓";font-weight:900;color:var(--green);position:absolute;left:0;top:7px}
  .cmp li.no::before{content:"✕";color:var(--red)}
  .cmp li.warn::before{content:"!";color:var(--amber)}
  .cmp.fiat{border-color:var(--amber)}.cmp.crypto{border-color:var(--green)}

  /* steps */
  figure{margin:0}
  .steps{display:flex;flex-direction:column;gap:18px;margin-top:8px}
  .step{display:grid;grid-template-columns:72px 1fr 1.25fr;gap:22px;align-items:center;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px 24px}
  .step.flip{grid-template-columns:72px 1.25fr 1fr}
  .step.flip .shot{order:2}.step.flip .txt{order:3}
  .step .n{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#fff;background:var(--green)}
  .m .step .n{background:var(--blue)}.a .step .n{background:var(--purple)}.c .step .n{background:var(--orange)}
  .step h3{margin:0 0 6px;font-size:20px;line-height:1.2}
  .step p{margin:0;color:var(--ink2)}
  .step .hint{margin-top:10px;font-size:13px;color:var(--muted);padding-left:12px;border-left:3px solid var(--line)}
  .shot{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card2);position:relative}
  .shot img{display:block;width:100%;height:auto;cursor:zoom-in}
  .shot figcaption{position:absolute;left:10px;bottom:10px;background:rgba(10,14,22,.85);color:#fff;font-size:12px;padding:4px 10px;border-radius:8px;max-width:calc(100% - 20px)}
  .shot.ph{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--amber);background:var(--amber-s);color:var(--ink);padding:20px;font-size:14px}
  .shot.ph b{display:block;font-size:26px;margin-bottom:6px}
  t{font-style:normal}
  t i{font-style:normal}
  .zs{font-size:.84em;opacity:.55;margin-left:.32em;white-space:nowrap;font-weight:400}
  .chip{display:inline-block;background:var(--chip);border-radius:6px;padding:0 7px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--ink)}
  .m .chip{background:var(--blue-s);color:var(--blue)}.a .chip{background:var(--purple-s);color:var(--purple)}

  /* gallery of secondary screenshots */
  .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}
  .gallery .shot figcaption{position:static;background:var(--card);color:var(--ink2);border-top:1px solid var(--line);border-radius:0;font-size:14px;line-height:1.7;padding:10px 14px;max-width:none}
  .gallery .shot figcaption .ref{margin-right:6px}

  /* callouts */
  .note{display:flex;gap:14px;align-items:flex-start;border-radius:14px;padding:16px 18px;margin-top:18px}
  .note .ic{font-size:24px;line-height:1}
  .note p{margin:0}
  .note.warn{background:var(--amber-s)}.note.info{background:var(--blue-s)}.note.ok{background:var(--green-s)}.note.bad{background:var(--red-s)}

  /* roles */
  .roles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .role{background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--sh);border-top:5px solid var(--green)}
  .role.m{border-color:var(--blue)}.role.a{border-color:var(--purple)}
  .role .ic{font-size:30px}
  .role b{display:block;margin:8px 0 4px;font-size:15px}
  .role p{margin:0;font-size:13px;color:var(--ink2)}

  /* decisions / gaps */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .cards.two{grid-template-columns:repeat(2,1fr)}
  .gallery.three{grid-template-columns:repeat(3,1fr)}
  .dc{background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--sh);border-left:5px solid var(--green)}
  .dc.todo{border-color:var(--blue)}.dc.risk{border-color:var(--red)}.dc.gap{border-color:var(--amber)}
  .dc .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .dc b{display:block;font-size:15px;margin:6px 0 4px}
  .dc p{margin:0;font-size:13px;color:var(--ink2)}
  .dc .own{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--ink);background:var(--chip);border-radius:6px;padding:1px 8px}

  /* tips */
  .tips{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tip{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--sh)}
  .tip .ic{font-size:26px}.tip b{display:block;margin:6px 0 2px}.tip p{margin:0;font-size:13px;color:var(--ink2)}

  /* transcript */
  details{background:var(--card);border-radius:14px;padding:14px 18px;margin-top:10px;box-shadow:var(--sh)}
  summary{cursor:pointer;font-weight:700;font-size:15px}
  .tx .t{display:grid;grid-template-columns:52px 96px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .tx .t span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
  .tx .t span:nth-child(2){color:var(--green-d);font-weight:700}
  .tx em{display:block;color:var(--muted);font-style:normal;font-size:13px}

  /* toc */
  .toc{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .toc .wrap{display:flex;gap:6px;overflow-x:auto;padding:10px 230px 10px 24px;scrollbar-width:none}
  .toc a{white-space:nowrap;text-decoration:none;color:var(--ink2);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
  .toc a:hover{border-color:var(--green)}

  .gloss{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .gcard{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:var(--sh)}
  .gcard h4{margin:0 0 8px;font-size:15px;color:var(--green-d)}
  .gcard table{width:100%;border-collapse:collapse;font-size:13.5px}
  .gcard td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .gcard td:first-child{width:46%;color:var(--ink);font-weight:600}
  .gcard td:last-child{color:var(--ink2)}
  footer{padding:48px 0 60px;color:var(--muted);font-size:13px}
  .frame{position:relative;line-height:0;container-type:inline-size}
  .hl{position:absolute;border:max(2px,.35cqw) solid #ff2d55;border-radius:max(4px,.8cqw);background:rgba(255,45,85,.10);box-shadow:0 0 0 max(1px,.15cqw) rgba(255,255,255,.9),0 0 1.2cqw rgba(255,45,85,.6);pointer-events:none}
  .hl.c{border-radius:50%}
  .hl::after{content:attr(data-n);position:absolute;--b:clamp(17px,3.6cqw,30px);left:calc(-1 * var(--b) / 2);top:calc(-1 * var(--b) / 2);width:var(--b);height:var(--b);border-radius:50%;background:#ff2d55;color:#fff;font:900 clamp(10px,2cqw,15px)/var(--b) Inter,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .lbl{position:absolute;z-index:3;background:#ff2d55;color:#fff;font:700 clamp(9px,1.45cqw,13px)/1.35 Inter,sans-serif;padding:.28em .6em;border-radius:.5em;white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.45);max-width:60cqw;overflow:hidden;text-overflow:ellipsis}
  .lang-zh .lbl{display:none}
  .canvas figcaption .zs{display:none}
  .canvas figcaption{white-space:normal;line-height:1.4}
  .canvas{position:relative;line-height:0}
  .lblkey{display:none;counter-reset:k;list-style:none;margin:0;padding:10px 14px 12px;line-height:1.5;
    font-size:13.5px;color:var(--ink2);background:var(--card);border-top:1px solid var(--line)}
  .lblkey li{counter-increment:k;position:relative;padding:2px 0 2px 26px}
  .lblkey li::before{content:counter(k);position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;
    background:#ff2d55;color:#fff;font:900 11px/18px Inter,sans-serif;text-align:center}
  .lang-zh .lblkey{display:none}
  @container (max-width: 520px){
    .lbl{display:none}
    .lang-en .lblkey{display:block}
  }
  /* fallback: on any narrow screen the words go under the image, container queries or not */
  @media (max-width: 820px){
    .lbl{display:none!important}
    .lang-en .lblkey{display:block!important}
  }
  .ref{display:inline-block;width:20px;height:20px;border-radius:50%;background:#ff2d55;color:#fff;font:900 12px/20px Inter,sans-serif;text-align:center;vertical-align:-3px;margin:0 2px}
  .hint .ref{width:18px;height:18px;font-size:11px;line-height:18px}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:100;cursor:zoom-out}
  #lightbox img{max-width:96vw;max-height:96vh;border-radius:8px}

  @media (max-width:980px){.gloss{grid-template-columns:1fr}
    .kpis,.roles,.tips{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:1fr}
    .map{grid-template-columns:1fr}.arrow{transform:rotate(90deg);height:40px}
    .timeline{grid-template-columns:1fr;gap:18px}.timeline::before{display:none}.tl{text-align:left;display:grid;grid-template-columns:76px 1fr;gap:4px 14px}.tl .n{margin:0;grid-row:1/span 4}.tl>:not(.n){grid-column:2}.tl .who{justify-self:start}
    .step,.step.flip{grid-template-columns:56px 1fr}.step .shot,.step.flip .shot{grid-column:1/-1;order:9}
    .compare{grid-template-columns:1fr}
  }
  @media (max-width:600px){.kpis,.roles,.tips,.cards,.gallery{grid-template-columns:1fr}.langbar{top:8px;right:8px}
    /* quote rows stack: a 52px/96px/1fr grid leaves the quote ~210px wide */
    .tx .t{grid-template-columns:1fr;gap:1px}.tx .t span:first-child{font-size:12px}
    /* caption off the image, so it stops covering the bottom row of markers */
    .shot figcaption{position:static;background:var(--card);color:var(--ink2);border-radius:0;border-top:1px solid var(--line);max-width:none;line-height:1.45;padding:8px 12px}
  }
  /* a dense UI screenshot gets the full content width instead of half a step row */
  .step.wide{grid-template-columns:72px 1fr}
  .full{margin:18px 0 22px}
  .note+.cards,.note+.compare,.full+.cards,.full+.compare{margin-top:20px}
  /* .dc b / .tip b are block for the card TITLE; inline bold inside a card paragraph must stay inline */
  .dc p b,.tip p b,.box small b,.dc .own b{display:inline;font-size:inherit;margin:0}
  /* four pills on one dense screenshot collide; the push-apart pass then detaches them
     from their boxes and buries the numbers. Numbers on the image, words in the key. */
  .full .lbl{display:none}
  .full .lblkey{display:block}
  /* static, so it sits under the shot instead of over the bottom row of content */
  .full figcaption{position:static;background:var(--card);color:var(--ink2);border-top:1px solid var(--line);border-radius:0;max-width:none;line-height:1.45;padding:9px 14px;font-size:13px}
  .full .shot img{max-height:none}
  .full figcaption{font-size:13px}
  /* ============ data visualisation ============
     Series palette = the brand hues stepped into the dark lightness band and
     validated (scripts/validate_palette.js, all-pairs, both modes). Only THREE
     series slots are gate-safe: brand blue/purple and orange/amber/red collide
     under CVD. A 4th series folds into "Other" or facets — never a new hue. */
  :root{
    --s1:#009f6e;--s2:#5282e2;--s3:#bf7023;    /* series, dark surface */
    --s-dim:#5b677d;                            /* de-emphasis (context marks) */
    --grid:#2a3448;--axis:#3a4559;--vsurf:var(--card);
    --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b
  }
  html.theme-light{
    --s1:#0e9f6e;--s2:#2563eb;--s3:#ea7a1a;
    --s-dim:#9aa5b5;--grid:#e6eaf1;--axis:#c9d1dd
  }

  figure.viz{margin:0 0 4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px 16px}
  figure.viz figcaption{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.5}
  figure.viz figcaption b{display:inline;font-size:inherit;color:var(--ink2)}
  .viz h4{margin:0 0 2px;font-size:17px;letter-spacing:-.01em}
  .viz .sub{margin:0 0 16px;font-size:13.5px;color:var(--muted)}
  .viz svg{display:block;width:100%;height:auto;overflow:visible}
  .viz text{font-family:inherit;fill:var(--muted);font-size:12px}
  .viz .v-val{fill:var(--ink);font-weight:700;font-size:13px}    /* direct labels: ink, never series colour */
  .viz .v-cat{fill:var(--ink2);font-size:12.5px}
  .viz .v-grid{stroke:var(--grid);stroke-width:1}
  .viz .v-axis{stroke:var(--axis);stroke-width:1}
  .viz .v-line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .viz .v-dot{stroke:var(--vsurf);stroke-width:2}                /* 2px surface ring */
  .viz .v-bar{rx:4}                                              /* 4px rounded data-end */
  .viz .v-hit{fill:transparent;cursor:pointer}
  .viz .v-hit:hover,.viz .v-hit:focus-visible{fill:var(--ink);fill-opacity:.08}
  .viz [data-rows]{outline:none}
  .viz rect[data-rows]:hover,.viz rect[data-rows]:focus-visible{filter:brightness(1.14)}

  /* legend — mark mirrors the form: rect for bars/areas, line for lines */
  .v-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 14px;font-size:12.5px;color:var(--ink2)}
  .v-leg span{display:inline-flex;align-items:center;gap:7px}
  .v-leg i{width:11px;height:11px;border-radius:3px;flex:none}
  .v-leg i.ln{width:16px;height:3px;border-radius:2px}

  /* tooltip — value leads, series name follows */
  .v-tip{position:fixed;z-index:80;pointer-events:none;opacity:0;transition:opacity .1s;
    background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    box-shadow:0 10px 26px rgba(0,0,0,.3);font-size:13px;max-width:260px}
  .v-tip.on{opacity:1}
  .v-tip .tt-c{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
  .v-tip .tt-r{display:flex;align-items:baseline;gap:8px;margin-top:3px}
  .v-tip .tt-k{width:16px;height:3px;border-radius:2px;flex:none;align-self:center}
  .v-tip .tt-v{font-weight:800;color:var(--ink)}
  .v-tip .tt-n{color:var(--ink2);font-size:12px}

  /* table view — every value stays reachable without hovering */
  .v-tbl{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .v-tbl summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:700}
  .v-tbl summary:hover{color:var(--ink2)}
  .v-tbl table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;font-variant-numeric:tabular-nums}
  .v-tbl th{text-align:left;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:0 10px 7px 0;font-weight:700}
  .v-tbl td{padding:6px 10px 6px 0;border-top:1px solid var(--line);color:var(--ink2)}
  .v-tbl td:first-child{color:var(--ink)}
  @media (forced-colors:active){.viz .v-bar,.viz .v-dot{forced-color-adjust:none}}
  .figs{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:18px}
  .figs.one{grid-template-columns:1fr}
  @media (max-width:860px){.figs{grid-template-columns:1fr}}

/* Back-office manual: encyclopedia layout on top of the shared _base.css tokens and screenshot markers. */
body{min-height:100vh}
a{text-decoration:none}
a:hover{text-decoration:underline}
code{font:600 .9em/1 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--chip);border-radius:5px;padding:2px 6px}

/* section colours */
[data-sec=basics]{--sc:var(--green);--sc-s:var(--green-s)}
[data-sec=games]{--sc:var(--blue);--sc-s:var(--blue-s)}
[data-sec=reverse]{--sc:var(--purple);--sc-s:var(--purple-s)}
[data-sec=clients]{--sc:var(--orange);--sc-s:var(--orange-s)}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:14px;max-width:1380px;margin:0 auto;padding:10px 20px}
.brand{display:flex;flex-direction:column;line-height:1.15;color:var(--ink);white-space:nowrap}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand:hover{text-decoration:none}
.menu-btn{display:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
.theme{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.theme button{border:0;background:transparent;padding:6px 11px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:13px}
.theme button.on{background:var(--green);color:#06281c}

/* search */
.search{position:relative;flex:1;max-width:640px;margin-left:auto}
.search input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 40px 10px 40px;outline:none}
.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.search .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:15px}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:700 11px/1 Inter,sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.drop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);max-height:min(70vh,560px);overflow:auto;display:none;padding:6px}
.drop.on{display:block}
.res{display:block;padding:10px 12px;border-radius:10px;color:var(--ink)}
.res:hover,.res.sel{background:var(--card2);text-decoration:none}
.res .rt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.res .rs{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.45}
.res mark,.hit mark{background:color-mix(in srgb,var(--amber) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--sc-s,var(--chip));color:var(--sc,var(--ink2));white-space:nowrap}
.badge.sit{background:var(--amber-s);color:var(--amber)}
.badge.term{background:var(--chip);color:var(--ink2)}
.drop .none{padding:14px;color:var(--muted);font-size:14px}
.drop .more{display:block;text-align:center;font-size:13px;padding:8px;color:var(--green-d)}

/* layout */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:0;max-width:1380px;margin:0 auto}
.side{position:sticky;top:61px;align-self:start;height:calc(100vh - 61px);overflow:auto;padding:22px 14px 40px 20px;border-right:1px solid var(--line);scrollbar-width:thin}
.side h4{margin:18px 0 6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.side h4 i{width:9px;height:9px;border-radius:3px;background:var(--sc)}
.side h4:first-child{margin-top:0}
.side a{display:block;padding:5px 10px;border-radius:8px;color:var(--ink2);font-size:13.5px;line-height:1.35}
.side a:hover{background:var(--card);text-decoration:none;color:var(--ink)}
.side a.on{background:var(--sc-s,var(--card));color:var(--ink);font-weight:700}
.side .home-link{font-weight:700;color:var(--ink);margin-bottom:4px}
main{min-width:0;padding:30px 40px 80px}
.doc{max-width:960px}

/* home */
.hero2{border-radius:22px;padding:38px 36px 32px;background:radial-gradient(900px 400px at 15% -20%,#1b6b52 0%,#0a0f18 60%);color:#fff;margin-bottom:28px}
.hero2 .eyebrow{color:#9fb3c8}
.hero2 h1{font-size:clamp(28px,4vw,44px);line-height:1.08;margin:8px 0 10px;letter-spacing:-.02em;color:#fff}
.hero2 h1 em{font-style:normal;color:#5ee0a8}
.hero2 p{color:#dbe5ef;font-size:16.5px;max-width:700px;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{font-size:13.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 13px}
.chips a:hover{background:rgba(255,255,255,.16);text-decoration:none}
.h2{font-size:24px;letter-spacing:-.02em;margin:34px 0 4px}
.sub2{color:var(--ink2);margin:0 0 16px;font-size:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{display:block;background:var(--card);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--sh);border-top:4px solid var(--sc,var(--green));color:var(--ink)}
.tile:hover{text-decoration:none;transform:translateY(-1px)}
.tile .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sc)}
.tile h3{margin:6px 0 4px;font-size:17px;line-height:1.25}
.tile p{margin:0;color:var(--ink2);font-size:13.5px}
.tile ul{margin:10px 0 0;padding:0;list-style:none;font-size:13.5px}
.tile li{padding:3px 0;border-top:1px solid var(--line)}
.tile li:first-child{border-top:0}
.tile li a{color:var(--ink2)}
.rule{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);display:flex;gap:12px;align-items:flex-start}
.rule .ic{font-size:22px;line-height:1.2}
.rule b{display:block;font-size:14.5px;margin-bottom:2px}
.rule p{margin:0;font-size:13.5px;color:var(--ink2)}
.colours{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.col3{border-radius:14px;padding:14px 16px;font-size:14px}
.col3 b{display:block;font-size:16px;margin-bottom:2px}
.col3.y{background:var(--amber-s)}.col3.y b{color:var(--amber)}
.col3.r{background:var(--red-s)}.col3.r b{color:var(--red)}
.col3.g{background:var(--green-s)}.col3.g b{color:var(--green-d)}

/* tables */
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--sh);font-size:14px}
.tbl th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:11px 14px;background:var(--card2)}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top;color:var(--ink2)}
.tbl td:first-child{color:var(--ink);font-weight:600}
.tbl tr.target{outline:2px solid var(--amber);outline-offset:-2px}

/* topic */
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}
.crumbs .badge{margin-left:6px;vertical-align:1px}
.doc h1{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em;line-height:1.1;margin:0 0 10px}
.doc .lead{font-size:17px;color:var(--ink2);margin:0 0 18px;max-width:780px}
.where{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--card);border-radius:12px;padding:11px 14px;font-size:14px;box-shadow:var(--sh);border-left:4px solid var(--sc)}
.where .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.asks{margin-top:14px;background:var(--sc-s);border-radius:12px;padding:12px 16px}
.asks .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sc)}
.asks ul{margin:6px 0 0;padding-left:18px;font-size:14.5px}
.asks li{margin:2px 0}

.ui{display:inline;font-weight:700;color:var(--ink);white-space:normal}
.ui .uz{font-weight:600;font-size:.84em;color:var(--muted);margin-left:.3em;white-space:nowrap}
.ui .uz::before{content:"「"}.ui .uz::after{content:"」"}

.ms{list-style:none;margin:22px 0 0;padding:0;counter-reset:ms}
.ms>li{position:relative;padding:0 0 0 48px;margin:0 0 26px;counter-increment:ms}
.ms>li::before{content:counter(ms);position:absolute;left:0;top:-2px;width:32px;height:32px;border-radius:10px;background:var(--sc);color:#fff;font:900 16px/32px Inter,sans-serif;text-align:center}
.ms>li.noimg{margin-bottom:14px}
.ms .stx{font-size:15.5px;line-height:1.6}
.ms .stx p{margin:0 0 6px}
.ms figure.shot{margin-top:12px}
.ms .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ms .pair figure.shot{margin-top:0}
.shot figcaption{position:static;background:var(--card);color:var(--ink2);border-top:1px solid var(--line);border-radius:0;max-width:none;line-height:1.45;padding:8px 13px;font-size:13px}
.shot .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:1px 8px;margin-right:6px;background:var(--chip);color:var(--ink2)}
.shot .tag.after{background:var(--green-s);color:var(--green-d)}
/* side-by-side pairs and screens with 3+ markers: numbers on the image, words in the key underneath,
   so the pills never cover the Chinese field labels the reader is trying to match */
.pair .lbl,.shot.dense .lbl{display:none!important}
.pair .lblkey,.shot.dense .lblkey{display:block!important}

.watch{display:flex;gap:12px;align-items:flex-start;background:var(--red-s);border-radius:14px;padding:14px 16px;margin:12px 0}
.watch .ic{font-size:20px;line-height:1.3}
.watch b{color:var(--red)}
.watch p{margin:0}
.tipbox{display:flex;gap:12px;align-items:flex-start;background:var(--blue-s);border-radius:14px;padding:14px 16px;margin:12px 0}
.tipbox p{margin:0}
.todo-box{display:flex;gap:12px;background:var(--amber-s);border:1px dashed var(--amber);border-radius:14px;padding:14px 16px;margin:12px 0}
.todo-box p{margin:0}

.blk{margin-top:30px}
.blk h3{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.labels td:first-child{font-weight:700;white-space:nowrap}
.labels td:nth-child(2){color:var(--ink)}
.rel{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rel a{display:block;background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--sh);border-left:4px solid var(--sc);color:var(--ink)}
.rel a:hover{text-decoration:none;background:var(--card2)}
.rel a small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.rel a b{font-size:14.5px}
.rel a span{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.pn a{background:var(--card);border-radius:12px;padding:12px 16px;box-shadow:var(--sh);color:var(--ink)}
.pn a small{display:block;color:var(--muted);font-size:12px}
.pn a.next{text-align:right;grid-column:2}
.src{margin-top:26px;font-size:12.5px;color:var(--muted)}

/* search results page */
.hit{display:block;background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:10px;color:var(--ink)}
.hit:hover{text-decoration:none;background:var(--card2)}
.hit .rt{display:flex;gap:8px;align-items:center;font-weight:700;font-size:16px}
.hit .rs{color:var(--ink2);font-size:14px;margin-top:4px}

/* lightbox fix: the cloned frame is the content */
#lightbox .frame{background:var(--card);border-radius:10px;overflow:hidden}

@media (max-width:1100px){.grid3,.rel{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:61px;bottom:0;width:290px;height:auto;z-index:45;background:var(--bg);transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh)}
  body.nav-open .side{transform:none}
  .menu-btn{display:block}
  main{padding:22px 16px 60px}
  .brand span{display:none}
  .ms .pair{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top .in{gap:8px;padding:10px 12px;flex-wrap:wrap}
  .search{order:9;flex-basis:100%;max-width:none}
  .search kbd{display:none}
  .side{top:110px}
  .grid3,.grid2,.rel,.colours{grid-template-columns:1fr}
  .hero2{padding:26px 20px}
  .ms>li{padding-left:0}
  .ms>li::before{position:static;display:block;margin-bottom:8px}
  .pn{grid-template-columns:1fr}.pn a.next{grid-column:1}
  .tbl{font-size:13px}.tbl th,.tbl td{padding:8px 10px}
}

/* "Ask the manual" chat widget (bot.js). It keeps the Lucifer Gaming assistant's own look, monochrome silver on #080305,
   in both page themes: it reads as the assistant sitting on the manual, not as part of the page.
   The manual's tokens are redefined inside it so the shared markup (labels, links, code) stays legible on the dark panel. */
.bot-fab,.bot{
  --b-bg:#080305;--b-chrome:#e2e6f0;--b-text:#e5e7eb;--b-dim:#a3a3a3;--b-line:rgba(255,255,255,.12);--b-glass:rgba(255,255,255,.045);
  --ink:#eef2f7;--ink2:#c9ced8;--muted:#a3a3a3;--line:var(--b-line);--card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.07);--chip:rgba(255,255,255,.10);--green-d:var(--b-chrome)
}
.bot-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:55;display:flex;align-items:center;gap:9px;min-height:48px;padding:0 18px 0 12px;border-radius:999px;border:1px solid rgba(226,230,240,.38);background:var(--b-bg);color:var(--b-chrome);font:700 14.5px/1 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 4px rgba(226,230,240,.07);touch-action:manipulation}
.bot-fab svg{width:22px;height:22px;flex:none}
.bot-fab:hover{border-color:rgba(226,230,240,.75)}
.bot-fab:focus-visible,.bot :focus-visible{outline:2px solid var(--b-chrome);outline-offset:2px}
body.bot-open .bot-fab,body.nav-open .bot-fab{display:none}

.bot{position:fixed;right:20px;bottom:20px;z-index:60;margin:0;padding:0;width:min(420px,calc(100vw - 40px));height:min(660px,calc(100vh - 101px));display:flex;flex-direction:column;background:radial-gradient(520px 260px at 18% -12%,rgba(226,230,240,.11),transparent 65%),var(--b-bg);color:var(--b-text);border:1px solid var(--b-line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden;font-size:14.5px;line-height:1.55;animation:bot-in .16s ease-out}
.bot[hidden]{display:none}
@keyframes bot-in{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.bot{animation:none}}

.bot-h{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 16px;border-bottom:1px solid var(--b-line)}
.bot-logo{height:36px;width:auto;flex:none}
.bot-t{display:flex;flex-direction:column;line-height:1.25;min-width:0;padding-left:12px;border-left:1px solid var(--b-line)}
.bot-t strong{font-size:15px;color:var(--b-chrome)}
.bot-t span{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--b-dim)}
.bot-x{margin-left:auto;flex:none;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--b-dim);font-size:26px;line-height:1;cursor:pointer}
.bot-x:hover{background:var(--b-glass);color:var(--b-chrome)}

.bot-log{flex:1;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;overscroll-behavior:contain}
.b-msg{overflow-wrap:anywhere}
.b-msg p{margin:0 0 8px}
.b-msg>:last-child{margin-bottom:0}
.b-msg.b-me{align-self:flex-end;max-width:85%;background:rgba(226,230,240,.13);border:1px solid rgba(226,230,240,.2);border-radius:14px 14px 4px 14px;padding:8px 12px;color:var(--ink)}
.b-msg.b-ans{background:var(--b-glass);border:1px solid var(--b-line);border-radius:14px 14px 14px 4px;padding:12px 14px}
.b-msg.b-wait{color:var(--b-dim)}
.b-msg a{color:var(--b-chrome);text-decoration:underline;text-decoration-color:rgba(226,230,240,.4);text-underline-offset:2px}
.b-meta{color:var(--b-dim);font-size:13px}
.b-k,.b-also small{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--b-dim);margin-right:6px}
.b-warn{border-left:2px solid #f2b64a;padding-left:10px}
.b-warn .b-k{color:#f2b64a}
.b-steps{background:none;box-shadow:none;border-radius:0;padding:0;margin:2px 0 8px}
.b-steps summary{cursor:pointer;color:var(--b-chrome);font-weight:600;font-size:13.5px;padding:6px 0}
.b-steps ol{margin:4px 0 0;padding-left:20px}
.b-steps li{margin:0 0 6px}
a.b-cite{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;margin-top:10px;padding:9px 12px;border:1px solid rgba(226,230,240,.24);border-radius:10px;text-decoration:none;color:var(--b-text)}
.b-cite small{flex-basis:100%;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--b-dim)}
.b-cite strong{color:var(--b-chrome);font-size:14px;line-height:1.35}
.b-cite i{margin-left:auto;font-style:normal;color:var(--b-dim);font-size:20px;line-height:1}
a.b-cite:hover{background:rgba(226,230,240,.07)}
.b-also{margin-top:10px!important;font-size:13.5px}
.b-list{margin:0 0 8px;padding-left:18px}
.b-list li{margin:2px 0}
.b-try{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.b-try button{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid rgba(226,230,240,.24);background:transparent;color:var(--b-text);font:600 13px/1.2 Inter,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","Microsoft JhengHei",sans-serif;cursor:pointer}
.b-try button:hover{background:rgba(226,230,240,.08);border-color:rgba(226,230,240,.5)}

.bot-f{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--b-line)}
.bot-f textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:16px;line-height:1.4;color:var(--b-text);background:rgba(255,255,255,.05);border:1px solid var(--b-line);border-radius:12px;padding:11px 12px;max-height:120px;outline:none}
.bot-f textarea::placeholder{color:#8a8a8a}
.bot-f textarea:focus{border-color:rgba(226,230,240,.55)}
.bot-f button{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:var(--b-chrome);color:var(--b-bg);cursor:pointer;display:grid;place-items:center}
.bot-f button svg{width:20px;height:20px}
.bot-f.busy button{opacity:.45;cursor:progress}
.bot-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){
  .bot-fab{right:16px;bottom:calc(16px + env(safe-area-inset-bottom))}
  .bot{inset:0;width:auto;height:auto;border:0;border-radius:0;box-shadow:none}
  .bot-logo{height:28px}
  .bot-t span{letter-spacing:.06em}
  .bot-f{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  body.bot-open{overflow:hidden}
  main{padding-bottom:100px}
}
