<script>
// "Ask the manual": the Lucifer Gaming assistant as a chat widget on top of the manual.
// It answers from window.MANUAL through the manual's own search (window.Manual.rank in app.js): no second scorer, no model, no key.
// Every answer names the page it came from and links to it. When nothing matches well it says so and lists the closest pages.
//
// Live answers (optional): build with BOT_ENDPOINT=<url> and the widget asks that endpoint first.
// Contract: POST {question, history:[{role, content}]} → {answer, cites:["topic-id", …]}. The answer may use the manual's
// inline markup ({English|中文}, **bold**, [[topic-id]]). Reference server: tools/live-proxy.mjs (it holds the key; the page never does).
// A failed call, an unknown topic id or an answer that cites nothing falls back to the retrieval answer below.
(() => {
const { rank, unknownWords, md, esc, T, S } = window.Manual;
const M = window.MANUAL;
const LIVE = (window.MANUAL_BOT || {}).endpoint || "";

// Below this the best hit is a coincidence of one or two shared words, not an answer. Calibrated with tools/bot-check.mjs
// (2026-10-16: lowest right answer 13.4, highest not-in-manual question 10.6).
const MIN_SCORE = 12;
// chat filler that would dilute the search coverage of a question ("can you tell me how to … please")
// and helper verbs and question words the search does not drop ("what should I…", "does it…", "安全閥是什麼")
const FILLER = /\b(please|pls|plz|thanks|thank you|thank|thx|hi|hello|hey|guys|okay|ok|just|quick|quickly|question|(?:tell|show|help|teach) me|i (?:need|want|would like) to|do you know|is it possible to|know|does|did|should|would|could|will|shall|might|must|has|have|had|having|been|am|were)\b|請問|请问|是什麼|是什么|什麼是|什么是|什麼|什么|怎麼辦|怎么办|怎麼|怎么|如何|為什麼|为什么|的意思|意思|嗎|吗|呢|的/gi;

// The whole manual is about the back office, so "…in the back office" is context. As search words it only dilutes the match
// (it moved "what is the safety valve" to another page). "Which back office…" has no preposition in front and is kept.
const CONTEXT = /\b(?:in|on|inside|within|from) (?:the |our |my )?(?:back[- ]?office|backend|back[- ]end|admin(?: panel| backend)?)\b|在(?:後台|后台)/gi;

function pageOf(d) {
  if (d.kind === "term") return { href: d.href, title: d.title, sec: "Glossary" };
  const id = d.kind === "sit" ? M.situations[+d.id.slice(3)].topic : d.id;
  return { href: `#/t/${id}`, title: T[id].title, sec: S[T[id].section]?.short || "" };
}
function pagesOf(hits) {
  const seen = new Set(), out = [];
  for (const h of hits) { const p = pageOf(h.d); if (!seen.has(p.href)) { seen.add(p.href); out.push(p); } }
  return out;
}

function topicBody(t) {
  const bang = (t.watch || []).find(w => w.startsWith("!"));
  const steps = t.steps || [];
  return `<p>${md(t.summary)}</p>`
    + (t.where ? `<p class="b-where"><span class="b-k">Where</span> ${md(t.where)}</p>` : "")
    + (bang ? `<p class="b-warn"><span class="b-k">Watch out</span> ${md(bang.slice(1))}</p>` : "")
    + (steps.length ? `<details class="b-steps"><summary>${steps.length === 1 ? "Show the step" : `Show the ${steps.length} steps`}</summary><ol>${steps.map(s => `<li>${md(s.t)}</li>`).join("")}</ol></details>` : "");
}
function sitBody(s) {
  return `<p>${md(s.do)}</p><p class="b-meta">Situation: ${md(s.see)}</p>`;
}
function termBody(g) {
  return `<p><strong>${esc(g.term)}</strong>${g.zh ? ` 「${esc(g.zh)}」` : ""}: ${md(g.plain)}</p>${g.note ? `<p class="b-meta">${md(g.note)}</p>` : ""}`;
}

// The retrieval answer. Pure: question in, answer object out (tools/bot-check.mjs calls it through window.Manual.ask).
function answer(question) {
  const q = question.replace(CONTEXT, " ").replace(FILLER, " ").replace(/\s+/g, " ").trim();
  if (!q || !/[a-z0-9㐀-鿿]/i.test(q)) return { kind: "chat" };
  const hits = rank(q);
  const unknown = unknownWords(q);
  const top = hits[0];
  if (!top || top.sc < MIN_SCORE) {
    return { kind: "none", unknown, closest: pagesOf(hits.slice(0, 6)).slice(0, 3), score: top?.sc || 0 };
  }
  // a strong match that leaves words of the question unexplained is still answered, but the answer says which words up front
  const d = top.d;
  let html;
  if (d.kind === "topic") html = topicBody(T[d.id]);
  else if (d.kind === "sit") html = sitBody(M.situations[+d.id.slice(3)]);
  else html = termBody(M.glossary[+d.id.slice(1)]);
  const pages = pagesOf(hits.filter(h => h.sc >= top.sc * 0.45).slice(0, 8));
  const cite = pages[0];
  // a glossary answer still points to the best page that uses the term
  const also = pages.slice(1, 3);
  if (d.kind === "term" && !also.some(p => p.href.startsWith("#/t/"))) {
    const t = hits.find(h => h.d.kind !== "term");
    if (t) also.unshift(pageOf(t.d)), also.splice(2);
  }
  return { kind: "answer", html, cite, also, unknown, score: top.sc };
}

// ---------- optional live answers (see the contract at the top) ----------
const hist = [];
function fmt(s) { // the model's plain text → paragraphs and lists, through the same escaping markup renderer as the pages
  s = String(s).replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, txt) => T[id] ? m : (txt || ""));
  return s.trim().split(/\n{2,}/).map(b => {
    const lines = b.split("\n");
    const li = /^\s*(\d+[.)]|[-•*])\s+/;
    if (lines.every(l => li.test(l))) {
      const tag = /^\s*\d/.test(lines[0]) ? "ol" : "ul";
      return `<${tag}>${lines.map(l => `<li>${md(l.replace(li, ""))}</li>`).join("")}</${tag}>`;
    }
    return `<p>${lines.map(md).join("<br>")}</p>`;
  }).join("");
}
async function liveAnswer(question) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(LIVE, { method: "POST", headers: { "content-type": "application/json" }, signal: ctl.signal,
      body: JSON.stringify({ question, history: hist.slice(-6) }) });
    if (!r.ok) return null;
    const j = await r.json();
    const cites = [...new Set((j.cites || []).filter(id => T[id]))];
    if (!j.answer || !cites.length) return null;
    const pages = cites.map(id => pageOf({ kind: "topic", id }));
    return { kind: "answer", live: true, html: fmt(j.answer), cite: pages[0], also: pages.slice(1, 3) };
  } catch (e) { return null; } finally { clearTimeout(timer); }
}

// ---------- the widget ----------
const ORB = `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="8.5" fill="currentColor"/><circle cx="16" cy="16" r="13.5" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="2"/></svg>`;
const GREET = `<p>Ask how to do something in the back office, what a message on screen means, or what a label says, in English or 中文.</p><p class="b-meta">I answer only from this manual and link the page I used.</p>`;

const fab = document.createElement("button");
fab.className = "bot-fab"; fab.type = "button";

const box = document.createElement("section");
box.className = "bot"; box.id = "bot"; box.hidden = true;
box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Ask the manual");
box.innerHTML = `<header class="bot-h">
    <img class="bot-logo" src="img/lg-logo.webp" alt="Lucifer Gaming" width="647" height="208">
    <div class="bot-t"><strong>Ask the manual</strong><span>Lucifer Gaming assistant</span></div>
    <button class="bot-x" type="button" aria-label="Close">×</button>
  </header>
  <div class="bot-log" aria-live="polite"></div>
  <form class="bot-f">
    <label class="bot-sr" for="bot-q">Your question</label>
    <textarea id="bot-q" rows="1" placeholder="Ask about a task, a screen or a label…" enterkeyhint="send"></textarea>
    <button type="submit" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </form>`;
document.body.append(fab, box);
const log = box.querySelector(".bot-log"), form = box.querySelector(".bot-f"), ta = box.querySelector("textarea");

function say(who, html) {
  const m = document.createElement("div");
  m.className = "b-msg " + who; m.innerHTML = html;
  log.appendChild(m); log.scrollTop = log.scrollHeight;
  return m;
}
const words = ws => ws.map(w => `“${esc(w)}”`).join(", ").replace(/, ([^,]*)$/, " or $1");
const link = p => `<a class="b-cite" href="${p.href}"><small>From the manual${p.sec ? " · " + esc(p.sec) : ""}</small><strong>${esc(p.title)}</strong><i aria-hidden="true">›</i></a>`;
function render(r) {
  if (r.kind === "chat") return GREET;
  if (r.kind === "none") {
    const lead = r.unknown.length
      ? `<p>The manual doesn’t mention ${words(r.unknown)}, so I won’t guess.</p>`
      : `<p>I couldn’t find that in the manual, so I won’t guess.</p>`;
    return lead + (r.closest.length
      ? `<p class="b-meta">Closest pages</p><ul class="b-list">${r.closest.map(p => `<li><a href="${p.href}">${esc(p.title)}</a></li>`).join("")}</ul>`
      : "")
      + `<p class="b-meta">Or try a word from the screen, browse the <a href="#/situations">situations</a> and the <a href="#/glossary">glossary</a>, or see ${md("[[who-to-ask|who to ask]]")}.</p>`;
  }
  return (r.unknown?.length ? `<p class="b-meta">The manual doesn’t mention ${words(r.unknown)}. This is the closest page:</p>` : "")
    + r.html + link(r.cite)
    + (r.also.length ? `<p class="b-also"><small>Also see</small> ${r.also.map(p => `<a href="${p.href}">${esc(p.title)}</a>`).join(" · ")}</p>` : "");
}

async function ask(question) {
  question = question.trim(); if (!question || form.classList.contains("busy")) return;
  say("b-me", `<p>${esc(question)}</p>`);
  let r = answer(question);
  if (LIVE && r.kind !== "chat") {
    const wait = say("b-ans b-wait", "<p>Checking the manual…</p>");
    form.classList.add("busy");
    const l = await liveAnswer(question);
    wait.remove(); form.classList.remove("busy");
    if (l) r = l;
  }
  say("b-ans", render(r));
  // what the live server sees of earlier turns: the answer's words and its source, not the card around them
  const t = document.createElement("div"); t.innerHTML = r.html || "";
  hist.push({ role: "user", content: question },
    { role: "assistant", content: r.kind === "answer" ? `${t.textContent.trim()}\n(Source: ${r.cite.title})` : "Not covered by the manual." });
}

function open() {
  box.hidden = false; fab.setAttribute("aria-expanded", "true"); document.body.classList.add("bot-open");
  if (!log.children.length) {
    const g = say("b-ans", GREET + `<div class="b-try">${(M.home.chips || []).slice(0, 4).map(c => `<button type="button">${esc(c)}</button>`).join("")}</div>`);
    g.querySelectorAll(".b-try button").forEach(b => b.onclick = () => ask(b.textContent));
  }
  if (matchMedia("(min-width: 641px)").matches) ta.focus();
}
function close() {
  box.hidden = true; fab.setAttribute("aria-expanded", "false"); document.body.classList.remove("bot-open");
  fab.focus();
}
fab.onclick = open;
box.querySelector(".bot-x").onclick = close;
box.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
form.onsubmit = e => { e.preventDefault(); if (form.classList.contains("busy")) return; const v = ta.value; ta.value = ""; grow(); ask(v); };
ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
function grow() { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight + 2, 120) + "px"; }
ta.addEventListener("input", grow);
// on a phone the panel covers the page: following a link closes it so the page shows (the conversation stays)
log.addEventListener("click", e => { if (e.target.closest("a[href^='#']") && !matchMedia("(min-width: 641px)").matches) close(); });

window.Manual.ask = answer;
})();

</script>
</body>
</html>
