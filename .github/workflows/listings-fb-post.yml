name: Listings -> FB page post

# Posts the oldest published-but-unposted ListPilot listing to the Next Frame
# Agency Facebook page from GitHub's CLEAN egress. The HF Space that runs the
# listings bot is behind an SNI egress firewall that blackholes graph.facebook.com,
# so the FB post can never originate there — it has to run from a clean host.
# This job reuses the Space's OWN app/ code (storage/registry/fb_publish),
# snapshotted fresh each run so it never drifts from what's deployed, and drains
# ONE listing per run (the poster enforces page-wide <=1/day anti-burst).
#
# DORMANT until the repo secret NEXTFRAME_FB_PAGE_TOKEN (a long-lived Page token)
# is set — without it the run is a green no-op. HF_LISTINGS_TOKEN (store auth) is
# already present for the keepalive workflow.

on:
  workflow_dispatch: {}                 # on-demand: Run button / gh workflow run / API
  repository_dispatch:                  # fired by the Space on Publish (increment 2)
    types: [listing-published]
  schedule:
    - cron: "17 */6 * * *"              # safety-net drain; anti-burst keeps it <=1/day

concurrency:
  group: listings-fb-post               # never two posters racing the same ledger
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps
        run: pip install --quiet huggingface_hub requests

      # Secrets pasted from a Windows/PowerShell file can carry a UTF-8 BOM or a
      # trailing newline; that lands inside the "Authorization: Bearer <tok>"
      # header and makes httpx/requests raise UnicodeEncodeError. Strip it once
      # here and expose the clean values (masked) to every later step.
      - name: Sanitize token secrets (strip BOM/whitespace)
        env:
          RAW_HF: ${{ secrets.HF_LISTINGS_TOKEN }}
          RAW_FB: ${{ secrets.NEXTFRAME_FB_PAGE_TOKEN }}
        run: |
          python - <<'PY'
          import os
          def clean(v): return (v or "").strip().replace("\ufeff", "")
          for src, dst in (("RAW_HF", "HF_TOKEN"), ("RAW_FB", "NEXTFRAME_FB_PAGE_TOKEN")):
              val = clean(os.environ.get(src, ""))
              if val:
                  print(f"::add-mask::{val}")   # keep the cleaned token out of logs
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"{dst}={val}\n")
          PY

      - name: Fetch the deployed Space's app/ (canonical, no drift)
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "NextFrame-ai/listings-bot", repo_type="space",
              allow_patterns=["app/*"], local_dir="listings-poster",
          )
          print("app/ snapshotted into listings-poster/")
          PY

      - name: Post the oldest published listing to the FB page
        run: |
          if [ -z "$NEXTFRAME_FB_PAGE_TOKEN" ]; then
            echo "Dormant: NEXTFRAME_FB_PAGE_TOKEN secret not set — nothing posted."
            echo "Add a long-lived Page token as a repo secret to activate."
            exit 0
          fi
          python listings-poster/scripts/fb_post_local.py --via=graph
