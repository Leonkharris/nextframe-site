<!doctype html>
<html lang="en-PH">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#0b0b0f" />
<title>Client Login — NextFrame</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0f;color:#f2f2f5;font-family:system-ui,Arial,sans-serif;padding:24px}
  .card{width:100%;max-width:420px;background:#14141b;border:1px solid #26262f;border-radius:18px;padding:32px 28px;text-align:center}
  img{width:96px;height:auto;margin-bottom:12px}
  h1{font-size:1.4rem;margin:.2em 0 .4em}
  p{color:#a9a9b6;line-height:1.5;font-size:.95rem}
  input{width:100%;padding:14px;border-radius:12px;border:1px solid #33333f;background:#0b0b0f;color:#fff;font-size:1rem;margin:12px 0}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:#1877f2;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  .err{color:#ff6b6b;min-height:1.2em;font-size:.9rem}
  small a{color:#8ab4ff}
</style>
</head>
<body>
<main class="card">
  <img src="https://ce6vsiuf1fnatbbk.public.blob.vercel-storage.com/next%20fram%20logo.png" alt="NextFrame" />
  <h1>Client Login</h1>
  <p id="msg">Enter the invite code NextFrame sent you to connect your Facebook Page and Instagram.</p>
  <form id="f" autocomplete="off">
    <input id="code" name="i" placeholder="Invite code" inputmode="text" autocapitalize="off" spellcheck="false" required />
    <button type="submit">Continue</button>
    <div class="err" id="err"></div>
  </form>
  <p><small>Secure Facebook login. You can remove access anytime — <a id="rm" href="#">how</a>.</small></p>
</main>
<script>
  // Set after the Cloudflare Worker is deployed (its workers.dev URL)
  var WORKER = "https://nextframe-client-auth.nextframe-agency.workers.dev";
  document.getElementById("rm").href = WORKER + "/remove";
  function go(code) {
    code = (code || "").trim();
    if (!/^[A-Za-z0-9_-]{16,64}$/.test(code)) { document.getElementById("err").textContent = "That code doesn't look right. Please check and try again."; return; }
    location.replace(WORKER + "/c/" + encodeURIComponent(code));
  }
  var i = new URLSearchParams(location.search).get("i");
  if (i) { document.getElementById("msg").textContent = "Taking you to secure Facebook login…"; go(i); }
  document.getElementById("f").addEventListener("submit", function (e) { e.preventDefault(); go(document.getElementById("code").value); });
</script>
</body>
</html>
